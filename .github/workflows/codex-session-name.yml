name: Codex session rename

on:
  pull_request:
    paths:
      - 'internal/codexname/**'
      - 'internal/nodeprobe/**'
      - 'internal/api/listing.go'
      - 'internal/api/codex_rename_test.go'
      - '.github/workflows/codex-session-name.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rename:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Metadata resolver and native descriptor fixture
        run: go test -race -count=1 -v ./internal/codexname
      - name: Safe provider join and name refresh
        run: go test -race -count=1 -v ./internal/nodeprobe -run '^TestCodexName'
      - name: Listing delta and Level2 name-only pushes
        run: go test -race -count=1 -v ./internal/api -run '^TestCodexRename'
