name: PR6 nodeprobe serve binding

on:
  pull_request:
    branches: [base/status-binding-7e55502]
    paths:
      - "internal/nodeprobe/**"
      - "cmd/agentmirrord/**"
      - "internal/api/**"
      - "internal/discovery/**"
      - "internal/protocol/**"
      - ".github/workflows/pr6-nodeprobe-serve.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  s6-red:
    name: Frozen S6 manifest red
    runs-on: macos-14
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run named S6 red boundary
        shell: bash
        run: |
          set -euo pipefail
          old="$RUNNER_TEMP/s6-old"
          git worktree add --detach "$old" f679f306ddecd2782461057cdf73b961c97c874f
          cat > "$old/internal/nodeprobe/t_s_manifest_red_test.go" <<'EOF'
          package nodeprobe
          import ("encoding/json"; "testing")
          func TestTSManifestMustPinNRed(t *testing.T) {
            var m manifest
            if err := json.Unmarshal(manifestBytes, &m); err != nil { t.Fatal(err) }
            if m.SourceCommit != "6e47021a7e3502843d490a2eeb0342c78c0231f3" { t.Fatalf("old manifest source=%s", m.SourceCommit) }
          }
          EOF
          set +e
          (cd "$old" && go test -count=1 ./internal/nodeprobe -run '^TestTSManifestMustPinNRed$' 2>&1 | tee "$RUNNER_TEMP/s6-red.log")
          rc=${PIPESTATUS[0]}
          set -e
          printf 'command=go test -count=1 ./internal/nodeprobe -run TestTSManifestMustPinNRed\nexit=%s\n' "$rc" | tee "$RUNNER_TEMP/s6-red-receipt.txt"
          grep -q 'old manifest source=' "$RUNNER_TEMP/s6-red.log"
          test "$rc" -ne 0
      - name: Upload S6 red evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr6-s6-red
          path: |
            ${{ runner.temp }}/s6-red.log
            ${{ runner.temp }}/s6-red-receipt.txt

  candidate:
    name: Go binding and daemon G-SAFE
    needs: s6-red
    runs-on: macos-14
    steps:
      - name: Checkout serve source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Checkout exact N source
        uses: actions/checkout@v4
        with:
          repository: Florious95/corral-core
          ref: 6e47021a7e3502843d490a2eeb0342c78c0231f3
          path: nodeprobe-source
          fetch-depth: 1
      - name: Install toolchains
        uses: dtolnay/rust-toolchain@stable
      - name: Select tmux
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v tmux >/dev/null 2>&1; then brew install tmux; fi
          echo "TMUX_REAL=$(command -v tmux)" >> "$GITHUB_ENV"
      - name: Build exact N binary and candidate daemon
        shell: bash
        run: |
          set -euo pipefail
          export CARGO_INCREMENTAL=0
          cargo build --manifest-path nodeprobe-source/tools/nodeprobe/Cargo.toml --locked --release
          go build -o "$RUNNER_TEMP/agentmirrord" ./cmd/agentmirrord
          file nodeprobe-source/tools/nodeprobe/target/release/nodeprobe | tee "$RUNNER_TEMP/nodeprobe-platform.txt"
          shasum -a 256 nodeprobe-source/tools/nodeprobe/target/release/nodeprobe | tee "$RUNNER_TEMP/nodeprobe-sha256.txt"
          wc -c nodeprobe-source/tools/nodeprobe/target/release/nodeprobe | tee "$RUNNER_TEMP/nodeprobe-size.txt"
          shasum -a 256 "$RUNNER_TEMP/agentmirrord" | tee "$RUNNER_TEMP/daemon-sha256.txt"
      - name: Prepare private G-SAFE wrappers
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/nodeprobe-gsafe"
          mkdir -p "$root/bin" "$root/tmux/tmux-$(id -u)"
          echo "AGENTMIRROR_GSAFE_ROOT=$root" >> "$GITHUB_ENV"
          echo "AGENTMIRROR_GSAFE_SOCKET=$root/tmux/tmux-$(id -u)/default" >> "$GITHUB_ENV"
          echo "AGENTMIRROR_GSAFE_TRACE=$root/candidate-trace.log" >> "$GITHUB_ENV"
          echo "AGENTMIRROR_GSAFE_CONTROL_TRACE=$root/control-trace.log" >> "$GITHUB_ENV"
          cat > "$root/bin/tmux" <<'SH'
          #!/bin/sh
          set -eu
          trace="${NODEPROBE_TRACE:-${TMPDIR:?}/candidate-trace.log}"
          sock=""
          category=other
          prev=""
          for arg in "$@"; do
            if [ "$prev" = 1 ]; then sock="$arg"; prev=""; continue; fi
            if [ "$arg" = "-S" ]; then prev=1; continue; fi
            case "$arg" in
              list-panes) category=list-panes;;
              capture-pane) category=capture-pane;;
              attach-session|attach|send-keys|pipe-pane|display-message) category=forbidden;;
            esac
          done
          bound=0
          [ "$sock" = "${AGENTMIRROR_GSAFE_SOCKET:?}" ] && bound=1
          case "$category" in
            capture-pane|forbidden)
              printf 'tool=tmux category=%s socket_bound=%s\nblocked=%s\n' "$category" "$bound" "$category" >> "$trace"
              exit 97
              ;;
            list-panes)
              [ "$bound" = 1 ] || exit 98
              printf 'tool=tmux category=list-panes socket_bound=1\n' >> "$trace"
              out="$(${TMUX_REAL:?} "$@")"
              printf '%s\n' "$out" | awk -F '\037' 'NR == 1 { print $5 }' > "${AGENTMIRROR_GSAFE_PID_FILE:?}"
              printf '%s\n' "$out"
              ;;
            *)
              exec "${TMUX_REAL:?}" "$@"
              ;;
          esac
          SH
          cat > "$root/bin/ps" <<'SH'
          #!/bin/sh
          set -eu
          trace="${NODEPROBE_TRACE:-${TMPDIR:?}/candidate-trace.log}"
          safe=0
          for arg in "$@"; do [ "$arg" = "pid=,ppid=,stat=,comm=" ] && safe=1; done
          if [ "$safe" = 1 ]; then
            printf 'tool=ps category=ps-narrow socket_bound=not-applicable\n' >> "$trace"
            printf '%s 1 S+ /usr/bin/codex\n' "$(cat "${AGENTMIRROR_GSAFE_PID_FILE:?}")"
            exit 0
          fi
          printf 'tool=ps category=ps-dangerous socket_bound=not-applicable\nblocked=ps-dangerous\n' >> "$trace"
          exit 97
          SH
          chmod +x "$root/bin/tmux" "$root/bin/ps"
          : > "$root/candidate-trace.log"
          : > "$root/control-trace.log"
          echo "AGENTMIRROR_GSAFE_PID_FILE=$root/pane.pid" >> "$GITHUB_ENV"
          echo "PATH=$root/bin:$PATH" >> "$GITHUB_ENV"
      - name: Run uncached Go binding and real daemon G-SAFE
        shell: bash
        run: |
          set -euo pipefail
          export AGENTMIRROR_GSAFE_DAEMON=1
          export AGENTMIRROR_GSAFE_ADDR=127.0.0.1:19086
          export AGENTMIRROR_GSAFE_URL=ws://127.0.0.1:19086/ws
          export AGENTMIRROR_GSAFE_TOKEN=serve-gsafe-token
          export AGENTMIRROR_GSAFE_TMUX_REAL="$TMUX_REAL"
          export AGENTMIRROR_NODEPROBE_BIN="$GITHUB_WORKSPACE/nodeprobe-source/tools/nodeprobe/target/release/nodeprobe"
          export NODEPROBE_FIXTURES="$GITHUB_WORKSPACE/nodeprobe-source/tools/nodeprobe/fixtures/titles.tsv"
          export NODEPROBE_PROVIDERS="$GITHUB_WORKSPACE/nodeprobe-source/tools/nodeprobe/fixtures/providers.tsv"
          export AGENTMIRROR_NODEPROBE_PI_EXTENSION="$GITHUB_WORKSPACE/nodeprobe-source/tools/nodeprobe/pi/nodeprobe-pi-activity.js"
          export TMUX_TMPDIR="$AGENTMIRROR_GSAFE_ROOT/tmux"
          export TMPDIR="$AGENTMIRROR_GSAFE_ROOT"
          export NODEPROBE_TRACE="$AGENTMIRROR_GSAFE_TRACE"
          export NODEPROBE_GSAFE_PID_FILE="$AGENTMIRROR_GSAFE_PID_FILE"
          go test -count=1 ./internal/nodeprobe ./internal/api ./cmd/agentmirrord | tee "$AGENTMIRROR_GSAFE_ROOT/go-test.log"
      - name: Inject and verify forbidden controls
        shell: bash
        run: |
          set -euo pipefail
          set +e
          NODEPROBE_TRACE="$AGENTMIRROR_GSAFE_CONTROL_TRACE" "$AGENTMIRROR_GSAFE_ROOT/bin/tmux" -S "$AGENTMIRROR_GSAFE_SOCKET" capture-pane -p -t gsafe:0.0 >/dev/null 2>&1
          capture_rc=$?
          NODEPROBE_TRACE="$AGENTMIRROR_GSAFE_CONTROL_TRACE" "$AGENTMIRROR_GSAFE_ROOT/bin/ps" ax >/dev/null 2>&1
          ps_rc=$?
          set -e
          printf 'capture_rc=%s\nps_dangerous_rc=%s\n' "$capture_rc" "$ps_rc" | tee "$AGENTMIRROR_GSAFE_ROOT/control-result.txt"
          test "$capture_rc" = 97
          test "$ps_rc" = 97
          test -s "$AGENTMIRROR_GSAFE_TRACE"
          grep -q 'category=list-panes socket_bound=1' "$AGENTMIRROR_GSAFE_TRACE"
          grep -q 'category=ps-narrow' "$AGENTMIRROR_GSAFE_TRACE"
          test "$(grep -c 'blocked=' "$AGENTMIRROR_GSAFE_TRACE" || true)" = 0
          test "$(grep -c 'blocked=' "$AGENTMIRROR_GSAFE_CONTROL_TRACE" || true)" = 2
          printf '{"positive_trace_lines":%s,"forbidden_rejections":%s}\n' "$(wc -l < "$AGENTMIRROR_GSAFE_TRACE" | tr -d ' ')" "$(grep -c 'blocked=' "$AGENTMIRROR_GSAFE_CONTROL_TRACE")" | tee "$AGENTMIRROR_GSAFE_ROOT/gsafe-receipt.json"
      - name: Upload binding and G-SAFE evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr6-nodeprobe-serve-evidence
          path: |
            ${{ runner.temp }}/nodeprobe-gsafe
            ${{ runner.temp }}/nodeprobe-platform.txt
            ${{ runner.temp }}/nodeprobe-sha256.txt
            ${{ runner.temp }}/nodeprobe-size.txt
            ${{ runner.temp }}/daemon-sha256.txt
