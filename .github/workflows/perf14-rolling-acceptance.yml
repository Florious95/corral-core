name: PERF14 rolling acceptance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/perf14-rolling-acceptance.yml
      - internal/api/**
      - internal/bridge/**
      - go.mod
      - go.sum

permissions:
  contents: read

env:
  PERF14_BASE: b98504e742ed1e7c7475767c512934b07eac592b
  PERF14_TASK_ID: perf14-scrollback-page-metadata
  PERF14_APP_APK_SHA256: bd4ababfcec3301c19ced02350ff2193f183311f9ec0bdd455145deab3b3e861
  PERF14_NODEPROBE_SHA256: e5667b9ebe931de7805a87538e03b9a6ee1fb9cb9250c25282f8b054268226b5
  PERF14_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
  PERF14_ARTIFACT_BASE: agentmirrord-r0-b985-darwin-arm64
  PERF14_ARTIFACT_CANDIDATE: agentmirrord-r1-candidate-darwin-arm64

jobs:
  rolling-r1:
    name: R0 checkpoint, fixed-base oracle red, candidate oracle green
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout immutable pull-request head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PERF14_HEAD_SHA }}
          fetch-depth: 0

      - name: Verify checkout identity and installed tmux fixture dependency
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse --show-toplevel)" = "$GITHUB_WORKSPACE"
          test "$(git rev-parse HEAD)" = "$PERF14_HEAD_SHA"
          test "$(git status --porcelain)" = ""
          test "$(git cat-file -t "$PERF14_BASE")" = commit
          if ! command -v tmux >/dev/null 2>&1; then
            sudo apt-get update -y
            sudo apt-get install -y tmux
          fi
          command -v tmux
          tmux -V
          root="$RUNNER_TEMP/perf14-r1"
          mkdir -p "$root"
          {
            printf 'head_commit=%s\n' "$(git rev-parse HEAD)"
            printf 'head_tree=%s\n' "$(git rev-parse HEAD^{tree})"
            printf 'base_commit=%s\n' "$PERF14_BASE"
            printf 'base_tree=%s\n' "$(git rev-parse "$PERF14_BASE^{tree}")"
            printf 'task_id=%s\n' "$PERF14_TASK_ID"
            printf 'app_apk_sha256=%s\n' "$PERF14_APP_APK_SHA256"
            printf 'nodeprobe_sha256=%s\n' "$PERF14_NODEPROBE_SHA256"
            printf 'tmux=%s\n' "$(tmux -V)"
          } | tee "$root/identity.txt"

      - name: Prove real tmux fixture and cleanup
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/perf14-r1"
          fixture="$root/real-tmux-fixture"
          mkdir -p "$fixture"
          cat > "$fixture/emit.sh" <<'EOF'
          #!/bin/sh
          printf 'PERF14_REAL_TMUX_FIXTURE\n'
          exec sleep 30
          EOF
          chmod 700 "$fixture/emit.sh"
          cat > "$fixture/cleanup_oracle.py" <<'PY'
          import argparse
          import errno
          import json
          import os
          import pathlib
          import socket
          import stat
          import tempfile

          STALE_ERRNOS = {errno.ECONNREFUSED, errno.ENOENT}

          class CleanupOracleError(RuntimeError):
              pass

          def identity(path):
              st = os.lstat(path)
              return {"dev": st.st_dev, "ino": st.st_ino, "mode": st.st_mode,
                      "is_socket": stat.S_ISSOCK(st.st_mode)}

          def classify_errno(err):
              if err is None:
                  return "live"
              if err in STALE_ERRNOS:
                  return "stale"
              raise CleanupOracleError(f"unexpected connect errno={err} ({os.strerror(err)})")

          def connect_state(path):
              try:
                  before = identity(path)
              except FileNotFoundError:
                  return "stale", errno.ENOENT, None
              if not before["is_socket"]:
                  raise CleanupOracleError(f"fixture path is not a socket lstat={before}")
              sock = socket.socket(socket.AF_UNIX, socket.SOCK_STREAM)
              sock.settimeout(0.2)
              try:
                  sock.connect(path)
              except socket.timeout as exc:
                  raise CleanupOracleError(f"connect timeout path={path}") from exc
              except OSError as exc:
                  return classify_errno(exc.errno), exc.errno, before
              else:
                  return classify_errno(None), None, before
              finally:
                  sock.close()

          def cleanup(path, expected, receipt):
              path = os.path.abspath(path)
              expected = os.path.abspath(expected)
              if path != expected or pathlib.Path(path).parent != pathlib.Path(expected).parent:
                  raise CleanupOracleError(f"path identity mismatch path={path} expected={expected}")
              state, err, before = connect_state(path)
              out = {"path": path, "expected": expected, "connect_errno": err,
                     "connect_state": state, "lstat_before": before}
              if state == "live":
                  raise CleanupOracleError(json.dumps(out, sort_keys=True))
              if before is not None:
                  after = identity(path)
                  out["lstat_before_delete"] = after
                  if after != before:
                      raise CleanupOracleError(f"fixture socket identity changed before delete: {out}")
                  os.unlink(path)
                  out["deleted"] = True
              else:
                  out["deleted"] = False
              out["exists_after"] = os.path.lexists(path)
              if out["exists_after"]:
                  raise CleanupOracleError(f"fixture socket remains after cleanup: {out}")
              pathlib.Path(receipt).write_text(json.dumps(out, sort_keys=True) + "\n")

          def self_test(receipt):
              with tempfile.TemporaryDirectory() as d:
                  d = pathlib.Path(d)
                  live = d / "live"
                  listener = socket.socket(socket.AF_UNIX, socket.SOCK_STREAM)
                  listener.bind(str(live)); listener.listen(1)
                  state, err, _ = connect_state(str(live))
                  assert (state, err) == ("live", None)
                  listener.close(); live.unlink()
                  stale = d / "stale"
                  closed = socket.socket(socket.AF_UNIX, socket.SOCK_STREAM)
                  closed.bind(str(stale)); closed.close()
                  state, err, before = connect_state(str(stale))
                  assert state == "stale" and err == errno.ECONNREFUSED and before["is_socket"]
                  stale.unlink()
                  state, err, before = connect_state(str(d / "missing"))
                  assert state == "stale" and err == errno.ENOENT and before is None
                  regular = d / "regular"; regular.write_text("not a socket")
                  try:
                      connect_state(str(regular))
                  except CleanupOracleError:
                      pass
                  else:
                      raise AssertionError("regular file was accepted")
                  for bad in (errno.ETIMEDOUT, errno.EACCES):
                      try:
                          classify_errno(bad)
                      except CleanupOracleError:
                          pass
                      else:
                          raise AssertionError(f"errno {bad} was accepted")
              pathlib.Path(receipt).write_text(json.dumps({"live": "PASS", "closed_refused": "PASS", "missing": "PASS", "regular_rejected": "PASS", "timeout_and_other_errno_rejected": "PASS"}) + "\n")

          parser = argparse.ArgumentParser()
          parser.add_argument("--self-test", action="store_true")
          parser.add_argument("--socket")
          parser.add_argument("--expected")
          parser.add_argument("--receipt", required=True)
          args = parser.parse_args()
          if args.self_test:
              self_test(args.receipt)
          elif args.socket and args.expected:
              cleanup(args.socket, args.expected, args.receipt)
          else:
              raise SystemExit("cleanup_oracle: --self-test or --socket/--expected required")
          PY
          chmod 700 "$fixture/cleanup_oracle.py"
          python3 "$fixture/cleanup_oracle.py" --self-test --receipt "$root/cleanup-oracle-self-test.json"
          env -u TMUX TMUX_TMPDIR=. tmux -S "$fixture/socket" -f /dev/null \
            new-session -d -x 40 -y 10 -s perf14-proof "$fixture/emit.sh"
          tmux -S "$fixture/socket" list-panes -a -F '#{session_name}|#{pane_id}|#{pane_width}x#{pane_height}' \
            | tee "$root/tmux-fixture-list.txt"
          tmux -S "$fixture/socket" capture-pane -p -t %0 | tee "$root/tmux-fixture-capture.txt"
          grep -Fx 'PERF14_REAL_TMUX_FIXTURE' "$root/tmux-fixture-capture.txt"
          tmux -S "$fixture/socket" kill-server
          for _ in $(seq 1 40); do
            test ! -e "$fixture/socket" && break
            sleep 0.05
          done
          python3 "$fixture/cleanup_oracle.py" --socket "$fixture/socket" --expected "$fixture/socket" --receipt "$root/cleanup-oracle.json"
          test ! -e "$fixture/socket"
          printf 'fixture=PASS\n' | tee "$root/tmux-fixture.status"

      - name: Prepare clean fixed-base and candidate clones
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/perf14-r1"
          git clone --no-local --no-tags "$GITHUB_WORKSPACE" "$root/base"
          git -C "$root/base" fetch --no-tags origin "$PERF14_BASE:refs/remotes/origin/perf14-base"
          git -C "$root/base" switch --detach "$PERF14_BASE"
          git clone --no-local --no-tags "$GITHUB_WORKSPACE" "$root/candidate"
          test "$(git -C "$root/base" status --porcelain)" = ""
          test "$(git -C "$root/candidate" status --porcelain)" = ""
          test "$(git -C "$root/base" rev-parse HEAD)" = "$PERF14_BASE"
          test "$(git -C "$root/candidate" rev-parse HEAD)" = "$PERF14_HEAD_SHA"
          test "$(git -C "$root/base" rev-parse HEAD^{tree})" = "$(git rev-parse "$PERF14_BASE^{tree}")"
          {
            printf 'base_toplevel=%s\n' "$(git -C "$root/base" rev-parse --show-toplevel)"
            printf 'base_commit=%s\nbase_tree=%s\n' "$(git -C "$root/base" rev-parse HEAD)" "$(git -C "$root/base" rev-parse HEAD^{tree})"
            printf 'candidate_toplevel=%s\n' "$(git -C "$root/candidate" rev-parse --show-toplevel)"
            printf 'candidate_commit=%s\ncandidate_tree=%s\n' "$(git -C "$root/candidate" rev-parse HEAD)" "$(git -C "$root/candidate" rev-parse HEAD^{tree})"
          } | tee "$root/clones.txt"

      - name: Verify every required PERF14 root exists
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/perf14-r1"
          python3 - "$root/candidate" <<'PY'
          import pathlib, re, sys
          root = pathlib.Path(sys.argv[1])
          names = [
              "TestScrollbackPageUsesBoundedMetadataAndOneCapture",
              "TestCountLinesTreatsNonEmptyBodyWithoutLFAsOne",
              "TestScrollbackRangeForBoundaries",
              "TestScrollbackTrimPreservesTrailingBlankRows",
              "TestPerf14RealStaticPagesAndActualGeometry",
              "TestPerf14HandlerBoundedCaptureWork",
              "TestPerf14HandlerRangeTable",
              "TestPerf14EmptyHistoryDoesNotCaptureScreen",
              "TestPerf14PageLineContentOracle",
              "TestPerf14ZeroCountRejectedBeforeTmux",
              "TestPerf14MetadataFailureDoesNotCapture",
              "TestScrollbackConvergedRange",
              "TestScrollbackExactHeaderBytes",
              "TestScrollbackPagingRange",
          ]
          text = "\n".join(p.read_text() for p in (root / "internal/api").glob("*_test.go"))
          text += "\n".join(p.read_text() for p in (root / "internal/bridge").glob("*_test.go"))
          missing = [n for n in names if not re.search(r"^func " + re.escape(n) + r"\s*\(", text, re.M)]
          if missing:
              raise SystemExit("missing required roots: " + ", ".join(missing))
          print("required_roots=PASS count=" + str(len(names)))
          PY

      - name: Build fixed b985 R0 checkpoint binary
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/perf14-r1"
          out="$root/$PERF14_ARTIFACT_BASE"
          (
            cd "$root/base"
            GOTOOLCHAIN=auto CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 \
              go build -trimpath -buildvcs=true -o "$out" ./cmd/agentmirrord
          )
          test -s "$out"
          file -b "$out" | tee "$root/base-file.txt"
          grep -Eq 'Mach-O 64-bit arm64' "$root/base-file.txt"
          go version -m "$out" | tee "$root/base-build-info.txt"
          sha256sum "$out" | tee "$root/base-sha256.txt"
          wc -c < "$out" | tr -d ' ' | tee "$root/base-bytes.txt"

      - name: Verify fixed-base behavior oracle is a named red
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/perf14-r1"
          cp "$root/candidate/internal/api/perf14_independent_oracle_test.go" "$root/base/internal/api/perf14_independent_oracle_test.go"
          set +e
          (
            cd "$root/base"
            GOTOOLCHAIN=auto go test -json -race -count=1 ./internal/api \
              -run '^TestPerf14HandlerBoundedCaptureWork$'
          ) > "$root/base-behavior-red.jsonl" 2>&1
          rc=$?
          set -e
          printf 'exit=%s\n' "$rc" | tee "$root/base-behavior-red.status"
          test "$rc" -ne 0
          python3 - "$root/base-behavior-red.jsonl" <<'PY'
          import json, sys
          events = [json.loads(line) for line in open(sys.argv[1]) if line.startswith('{')]
          root = [e for e in events if e.get('Test') == 'TestPerf14HandlerBoundedCaptureWork']
          if not any(e.get('Action') == 'run' for e in root) or not any(e.get('Action') == 'fail' for e in root):
              raise SystemExit('named base behavior root did not run and fail')
          if any(e.get('Action') == 'skip' for e in root):
              raise SystemExit('named base behavior root was skipped')
          print('base_behavior_red=PASS named_root=TestPerf14HandlerBoundedCaptureWork')
          PY

      - name: Preserve fixed-base compatibility result
        shell: bash
        run: |
          set +e
          root="$RUNNER_TEMP/perf14-r1"
          (
            cd "$root/base"
            GOTOOLCHAIN=auto go test -json -race -count=1 ./internal/api ./internal/bridge
          ) > "$root/base-compat.jsonl" 2>&1
          rc=$?
          printf 'exit=%s\n' "$rc" | tee "$root/base-compat.status"
          exit 0

      - name: Run each candidate PERF14 oracle root exactly once
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/perf14-r1"
          cases=(
            'TestScrollbackPageUsesBoundedMetadataAndOneCapture|./internal/api'
            'TestCountLinesTreatsNonEmptyBodyWithoutLFAsOne|./internal/api'
            'TestScrollbackRangeForBoundaries|./internal/api'
            'TestScrollbackTrimPreservesTrailingBlankRows|./internal/api'
            'TestPerf14RealStaticPagesAndActualGeometry|./internal/api'
            'TestPerf14HandlerBoundedCaptureWork|./internal/api'
            'TestPerf14HandlerRangeTable|./internal/api'
            'TestPerf14EmptyHistoryDoesNotCaptureScreen|./internal/api'
            'TestPerf14PageLineContentOracle|./internal/api'
            'TestPerf14ZeroCountRejectedBeforeTmux|./internal/api'
            'TestPerf14MetadataFailureDoesNotCapture|./internal/api'
            'TestScrollbackConvergedRange|./internal/api'
            'TestScrollbackExactHeaderBytes|./internal/api'
            'TestScrollbackPagingRange|./internal/bridge'
          )
          : > "$root/candidate-oracle.status"
          for entry in "${cases[@]}"; do
            name="${entry%%|*}"
            package="${entry##*|}"
            json="$root/candidate-$name.jsonl"
            set +e
            (
              cd "$root/candidate"
              GOTOOLCHAIN=auto go test -json -race -count=1 "$package" -run "^${name}$"
            ) > "$json" 2>&1
            rc=$?
            set -e
            printf '%s exit=%s file=%s\n' "$name" "$rc" "$json" | tee -a "$root/candidate-oracle.status"
            test "$rc" = 0
            python3 - "$json" "$name" <<'PY'
          import json, sys
          path, name = sys.argv[1:]
          events = [json.loads(line) for line in open(path) if line.startswith('{')]
          root = [e for e in events if e.get('Test') == name]
          if sum(e.get('Action') == 'run' for e in root) != 1:
              raise SystemExit(f'{name}: expected exactly one root RUN')
          if sum(e.get('Action') == 'pass' for e in root) != 1:
              raise SystemExit(f'{name}: expected exactly one root PASS')
          if any(e.get('Action') in {'fail', 'skip'} for e in root):
              raise SystemExit(f'{name}: FAIL/SKIP root event present')
          print(f'{name}=PASS run=1 pass=1 skip=0')
          PY
          done

      - name: Run candidate compatibility roots with the same race/no-cache gate
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/perf14-r1"
          names=(TestAuthGoodToken TestListReturnsFullListing)
          : > "$root/candidate-compat.status"
          for name in "${names[@]}"; do
            json="$root/candidate-compat-$name.jsonl"
            set +e
            (
              cd "$root/candidate"
              GOTOOLCHAIN=auto go test -json -race -count=1 ./internal/api -run "^${name}$"
            ) > "$json" 2>&1
            rc=$?
            set -e
            printf '%s exit=%s file=%s\n' "$name" "$rc" "$json" | tee -a "$root/candidate-compat.status"
            test "$rc" = 0
            python3 - "$json" "$name" <<'PY'
          import json, sys
          path, name = sys.argv[1:]
          events = [json.loads(line) for line in open(path) if line.startswith('{')]
          root = [e for e in events if e.get('Test') == name]
          if sum(e.get('Action') == 'run' for e in root) != 1 or sum(e.get('Action') == 'pass' for e in root) != 1:
              raise SystemExit(f'{name}: compatibility root not exactly RUN/PASS')
          if any(e.get('Action') in {'fail', 'skip'} for e in root):
              raise SystemExit(f'{name}: compatibility root FAIL/SKIP')
          print(f'{name}=PASS run=1 pass=1 skip=0')
          PY
          done

      - name: Build candidate R1 binary and verify embedded VCS identity
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/perf14-r1"
          out="$root/$PERF14_ARTIFACT_CANDIDATE"
          (
            cd "$root/candidate"
            GOTOOLCHAIN=auto CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 \
              go build -trimpath -buildvcs=true -o "$out" ./cmd/agentmirrord
          )
          test -s "$out"
          file -b "$out" | tee "$root/candidate-file.txt"
          grep -Eq 'Mach-O 64-bit arm64' "$root/candidate-file.txt"
          go version -m "$out" | tee "$root/candidate-build-info.txt"
          python3 - "$root/candidate-build-info.txt" "$PERF14_HEAD_SHA" <<'PY'
          import re, sys
          text = open(sys.argv[1]).read()
          revision = sys.argv[2]
          required = [
              r'^\s+build\s+vcs=git$',
              r'^\s+build\s+vcs\.revision=' + re.escape(revision) + r'$',
              r'^\s+build\s+vcs\.modified=false$',
          ]
          for pattern in required:
              if not re.search(pattern, text, re.M):
                  raise SystemExit('missing embedded build key: ' + pattern)
          print('candidate_embedded_vcs=PASS git revision=' + revision + ' modified=false')
          PY
          python3 - "$root/base-build-info.txt" "$PERF14_BASE" <<'PY'
          import re, sys
          text = open(sys.argv[1]).read()
          revision = sys.argv[2]
          for pattern in [r'^\s+build\s+vcs=git$', r'^\s+build\s+vcs\.revision=' + re.escape(revision) + r'$', r'^\s+build\s+vcs\.modified=false$']:
              if not re.search(pattern, text, re.M):
                  raise SystemExit('missing embedded base build key: ' + pattern)
          print('base_embedded_vcs=PASS git revision=' + revision + ' modified=false')
          PY
          sha256sum "$out" | tee "$root/candidate-sha256.txt"
          wc -c < "$out" | tr -d ' ' | tee "$root/candidate-bytes.txt"
          python3 - "$root" <<'PY'
          import hashlib, json, pathlib, subprocess, sys
          root = pathlib.Path(sys.argv[1])
          def git(path, *args):
              return subprocess.check_output(["git", "-C", str(path), *args], text=True).strip()
          def sha(path): return hashlib.sha256(path.read_bytes()).hexdigest()
          base, candidate = root / "base", root / "candidate"
          base_bin = root / "agentmirrord-r0-b985-darwin-arm64"
          candidate_bin = root / "agentmirrord-r1-candidate-darwin-arm64"
          m = {
              "task_id": "perf14-scrollback-page-metadata",
              "checkout": {"head": git(candidate, "rev-parse", "HEAD"), "tree": git(candidate, "rev-parse", "HEAD^{tree}")},
              "base": {"commit": git(base, "rev-parse", "HEAD"), "tree": git(base, "rev-parse", "HEAD^{tree}"), "artifact_sha256": sha(base_bin), "artifact_bytes": base_bin.stat().st_size, "behavior": "BASELINE_BEHAVIOR_RED; compatibility/full-suite status preserved separately"},
              "candidate": {"commit": git(candidate, "rev-parse", "HEAD"), "tree": git(candidate, "rev-parse", "HEAD^{tree}"), "artifact_sha256": sha(candidate_bin), "artifact_bytes": candidate_bin.stat().st_size, "oracle": "14 named roots RUN/PASS exactly once, no SKIP", "compatibility": "2 named roots RUN/PASS exactly once, no SKIP"},
              "app_apk_sha256": "bd4ababfcec3301c19ced02350ff2193f183311f9ec0bdd455145deab3b3e861",
              "nodeprobe_sha256": "e5667b9ebe931de7805a87538e03b9a6ee1fb9cb9250c25282f8b054268226b5",
              "tmux_fixture": "tmux-fixture.status",
          }
          (root / "manifest.json").write_text(json.dumps(m, indent=2) + "\n")
          print(json.dumps(m, indent=2))
          PY

      - name: Upload exact R0/R1 receipts and raw binaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf14-rolling-r1-${{ github.run_id }}
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/perf14-r1/agentmirrord-r0-b985-darwin-arm64
            ${{ runner.temp }}/perf14-r1/agentmirrord-r1-candidate-darwin-arm64
            ${{ runner.temp }}/perf14-r1/manifest.json
            ${{ runner.temp }}/perf14-r1/identity.txt
            ${{ runner.temp }}/perf14-r1/clones.txt
            ${{ runner.temp }}/perf14-r1/tmux-fixture.status
            ${{ runner.temp }}/perf14-r1/tmux-fixture-list.txt
            ${{ runner.temp }}/perf14-r1/tmux-fixture-capture.txt
            ${{ runner.temp }}/perf14-r1/cleanup-oracle-self-test.json
            ${{ runner.temp }}/perf14-r1/cleanup-oracle.json
            ${{ runner.temp }}/perf14-r1/real-tmux-fixture/cleanup_oracle.py
            ${{ runner.temp }}/perf14-r1/base-file.txt
            ${{ runner.temp }}/perf14-r1/base-build-info.txt
            ${{ runner.temp }}/perf14-r1/base-sha256.txt
            ${{ runner.temp }}/perf14-r1/base-bytes.txt
            ${{ runner.temp }}/perf14-r1/base-behavior-red.jsonl
            ${{ runner.temp }}/perf14-r1/base-behavior-red.status
            ${{ runner.temp }}/perf14-r1/base-compat.jsonl
            ${{ runner.temp }}/perf14-r1/base-compat.status
            ${{ runner.temp }}/perf14-r1/candidate-oracle.status
            ${{ runner.temp }}/perf14-r1/candidate-*.jsonl
            ${{ runner.temp }}/perf14-r1/candidate-compat.status
            ${{ runner.temp }}/perf14-r1/candidate-compat-*.jsonl
            ${{ runner.temp }}/perf14-r1/candidate-file.txt
            ${{ runner.temp }}/perf14-r1/candidate-build-info.txt
            ${{ runner.temp }}/perf14-r1/candidate-sha256.txt
            ${{ runner.temp }}/perf14-r1/candidate-bytes.txt
