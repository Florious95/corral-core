name: PERF16 exact device fixture and compatibility
on:
  pull_request:
    paths: [".github/workflows/perf16-device-e2e.yml"]
permissions:
  contents: read
jobs:
  exact-device-fixture:
    runs-on: macos-14
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 1fa3b651c613f7b973b5187429d8e9e50d9d3d45
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Install isolated test prerequisite
        run: |
          if ! command -v tmux >/dev/null; then brew install tmux; fi
          tmux -V
      - name: Exact source, compile-only, named compatibility, binaries
        env:
          P16_FIXTURE: ""
          P16_MANIFEST: ' {"source":"1fa3b651c613f7b973b5187429d8e9e50d9d3d45","source_tree":"a0c17d659665c5a2caf823fcf69dcd89f71337ea","fixture_tree":"b838a44238984468e964ca4a89e7d3ebf1cacfab","fixture_blob":"e963731198426f0b69977728eb7ad447a4cfe7e1","fixture_sha256":"ce270ea9edc0ff8c927c64e235f8340ecd7241d12ce42a7da5cd2685930d6afb","fixture_only":true,"executed":false} '
        run: |
          python3 - <<'PYRUN'
          import base64,os,pathlib,subprocess
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'perf16-device-runner.py'
          p.write_bytes(base64.b64decode(""))
          subprocess.run(['python3',str(p)],check=True)
          PYRUN
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf16-device-exact
          path: ${{ runner.temp }}/perf16-device
          if-no-files-found: error
