name: perf16-repair-bounded-gates
on:
  pull_request:
    paths:
      - .github/workflows/perf16-repair-bounded.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bounded-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 9b8fcf67ccda39cad28607be218c7808d3345bfd
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Materialize exact reviewed scope for hosted validation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/perf16-repair"
          python3 - <<'PYTHON'
          import base64,gzip,hashlib,os
          from pathlib import Path
          out=Path(os.environ['RUNNER_TEMP'])/'perf16-repair'
          patch=gzip.decompress(base64.b64decode(''))
          assert hashlib.sha256(patch).hexdigest()=='d0737153c524d7c70d4048495c759c6b065ee748d568b48af69741ef1ddc7348'
          (out/'candidate.patch').write_bytes(patch)
          (out/'mutations.py').write_bytes(base64.b64decode(''))
          PYTHON
          test "$(git rev-parse HEAD)" = 9b8fcf67ccda39cad28607be218c7808d3345bfd
          git apply --index "$RUNNER_TEMP/perf16-repair/candidate.patch"
          test "$(git write-tree)" = a031335c1e594f99a54aace6ec31103343ed7208
          printf 'source_sha=%s\ntested_tree=%s\n' "$(git rev-parse HEAD)" "$(git write-tree)" | tee "$RUNNER_TEMP/perf16-repair/identity.txt"
          sha256sum "$RUNNER_TEMP/perf16-repair/candidate.patch" | tee -a "$RUNNER_TEMP/perf16-repair/identity.txt"
      - name: Compile candidate before any behavior or mutation test
        shell: bash
        run: |
          set -euo pipefail
          set +e
          go test -race -count=1 -run '^$' ./internal/api ./internal/bridge 2>&1 | tee "$RUNNER_TEMP/perf16-repair/compile.log"
          rc=${PIPESTATUS[0]}
          set -e
          printf 'mode=compile_only_zero_tests\nexit=%s\n' "$rc" | tee "$RUNNER_TEMP/perf16-repair/compile.receipt"
          exit "$rc"
      - name: Install hosted-only tmux
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux
          tmux -V
      - name: Current named oracles on fixed product base
        shell: bash
        run: |
          set -euo pipefail
          base="$RUNNER_TEMP/perf16-fixed-base"
          git worktree add --detach "$base" b98504e742ed1e7c7475767c512934b07eac592b
          cp internal/api/overflow_recovery_test.go "$base/internal/api/"
          cp internal/bridge/overflow_recovery_test.go "$base/internal/bridge/"
          failed=0
          for spec in 'bridge TestSubscriberOverflowStopsOnlySlowSubscriber' 'api TestWSQueueOverflowAbortsOnceAndDiscardsQueue'; do
            read -r pkg name <<< "$spec"
            log="$RUNNER_TEMP/perf16-repair/base-${name}.log"
            set +e
            (cd "$base" && go test -race -count=1 -timeout 60s "./internal/$pkg" -run "^${name}$" -v) >"$log" 2>&1
            rc=$?
            set -e
            cat "$log"
            printf 'base=b98504e742ed1e7c7475767c512934b07eac592b test=%s exit=%s\n' "$name" "$rc" >> "$RUNNER_TEMP/perf16-repair/base.receipt"
            if [ "$rc" -eq 0 ] || ! grep -q "^--- FAIL: ${name} " "$log"; then failed=1; fi
          done
          exit "$failed"
      - name: Named candidate and compatibility tests once with race
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          while read -r pkg name; do
            log="$RUNNER_TEMP/perf16-repair/${name}.log"
            set +e
            go test -race -count=1 -timeout 120s "$pkg" -run "^${name}$" -v >"$log" 2>&1
            rc=$?
            set -e
            cat "$log"
            printf 'package=%s test=%s exit=%s\n' "$pkg" "$name" "$rc" >> "$RUNNER_TEMP/perf16-repair/candidate.receipt"
            if [ "$rc" -ne 0 ] || [ "$(grep -c "^--- PASS: ${name} " "$log")" -ne 1 ] || grep -q -- '--- SKIP:' "$log"; then failed=1; fi
          done <<'TESTS'
          ./internal/bridge TestSubscriberOverflowStopsOnlySlowSubscriber
          ./internal/bridge TestSubscriberOverflowEmitsOneLossSignal
          ./internal/bridge TestOverflowPublishesCauseBeforeDataEOF
          ./internal/bridge TestOldGenerationDetachCannotTouchNewGeneration
          ./internal/bridge TestSubscribeAttachRetriesAreBounded
          ./internal/api TestWSQueueOverflowAbortsOnceAndDiscardsQueue
          ./internal/api TestRelayLossAbortsConnectionAndDropsQueuedDeltas
          ./internal/api TestAbortDoesNotFlushDequeuedWriterFrame
          ./internal/api TestAbortDoesNotFlushFrameAlreadyDequeuedByFlush
          ./internal/api TestConcurrentEnqueueAbortStopsAllProducers
          ./internal/api TestLossReasonSurvivesLateWriterError
          ./internal/api TestConnMetricsConcurrentSnapshotIsolation
          ./internal/api TestInitialPublishedLossWinsCaptureFailure
          ./internal/api TestReadyRelayOverflowWhileControlSendBlocked
          ./internal/api TestInitialSubscribeLossCancelsCapture
          ./internal/api TestInitialSubscribeLossCancelsFirstFrameQueue
          ./internal/api TestInitialSubscribeCaptureErrorReleasesGeometry
          ./internal/api TestOverflowDisconnectReplayStaticOracle
          ./internal/api TestAuthBadToken
          ./internal/api TestFanoutDisplacedSendsError
          ./internal/api TestFanoutTwoSubscribersStillReceiveAPI
          ./internal/api TestFanoutFirstDisconnectDoesNotKickSecondAPI
          ./internal/api TestAbnormalTeardownRestoresPaneGeometry
          ./internal/api TestSecondSubscriberDoesNotRebase
          ./internal/api TestUnsubscribeRestoresOriginalPaneSize
          ./internal/bridge TestFanoutTwoSubscribersStillReceive
          ./internal/bridge TestFanoutFirstDetachDoesNotKickSecond
          TESTS
          exit "$failed"
      - name: Corresponding mutation teeth once with race
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          while read -r mutation; do
            # The index is the exact candidate, not the old checkout HEAD.
            git restore --worktree -- internal/api/ws_conn.go internal/api/ws_handler.go internal/api/sendq_metrics.go internal/bridge/stream.go
            read -r pkg name < <(python3 "$RUNNER_TEMP/perf16-repair/mutations.py" "$mutation")
            git diff > "$RUNNER_TEMP/perf16-repair/mutation-${mutation}.diff"
            log="$RUNNER_TEMP/perf16-repair/mutation-${mutation}.log"
            set +e
            go test -race -count=1 -timeout 60s "$pkg" -run "^${name}$" -v >"$log" 2>&1
            rc=$?
            set -e
            cat "$log"
            printf 'mutation=%s package=%s test=%s exit=%s\n' "$mutation" "$pkg" "$name" "$rc" >> "$RUNNER_TEMP/perf16-repair/mutation.receipt"
            if [ "$rc" -eq 0 ] || ! grep -q "^--- FAIL: ${name} " "$log"; then failed=1; fi
          done <<'MUTATIONS'
          transport_close
          writer_guard
          flush_guard
          exclusive_send
          capture_cancel
          loss_log
          metrics_snapshot
          cause_order
          MUTATIONS
          git restore --worktree -- internal/api/ws_conn.go internal/api/ws_handler.go internal/api/sendq_metrics.go internal/bridge/stream.go
          git diff --exit-code
          exit "$failed"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf16-repair-bounded-${{ github.run_id }}
          path: ${{ runner.temp }}/perf16-repair
