name: perf15-catalog-refresh-coordinator
on:
  push:
    branches: [fix/catalog-refresh-coordinator]
    paths: ['.github/workflows/perf15-catalog-refresh.yml', 'tools/perf15/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bounded:
    if: ${{ !contains(github.event.head_commit.message, '[perf15-observer]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Install isolated fixture dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux
          tmux -V
      - name: Exact source, compile, named base red and candidate wave
        env:
          PERF15_EXPECTED_TREE: 3bd356e1f0211b2afe72d5548bc5467689319f6b
          PERF15_PATCH_SHA256: fefe9f4c6c613289e8f90f25d01e8a9c63288fe196eab44478b8e8e78692f7de
        run: python3 tools/perf15/hosted.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf15-catalog-refresh-${{ github.run_id }}
          path: ${{ runner.temp }}/perf15
  observer-compile:
    if: ${{ contains(github.event.head_commit.message, '[perf15-observer]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-disabled: true
      - name: Compile external observer only; fixed product APK is never built
        run: python3 tools/perf15/observer/hosted_compile.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf15-observer-${{ github.run_id }}
          path: ${{ runner.temp }}/perf15-observer
