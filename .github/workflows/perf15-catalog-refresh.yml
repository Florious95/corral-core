name: perf15-catalog-refresh-coordinator
on:
  push:
    branches: [fix/catalog-refresh-coordinator]
    paths: ['.github/workflows/perf15-catalog-refresh.yml', 'tools/perf15/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bounded:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Install isolated fixture dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux
          tmux -V
      - name: Exact source, compile, named base red and candidate wave
        env:
          PERF15_EXPECTED_TREE: 6d9c5be362a6f36cadff3573ea2ff8617b4364f9
          PERF15_PATCH_SHA256: cfe6aaf2e19d044cc2adee7ede2f0bd85abf5ab28e35465f8230bdf156c0a4e3
        run: python3 tools/perf15/hosted.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf15-catalog-refresh-${{ github.run_id }}
          path: ${{ runner.temp }}/perf15
