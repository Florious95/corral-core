name: perf15-catalog-refresh-coordinator
on:
  push:
    branches: [fix/catalog-refresh-coordinator]
    paths: ['.github/workflows/perf15-catalog-refresh.yml', 'tools/perf15/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bounded:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Install isolated fixture dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux
          tmux -V
      - name: Exact source, compile, named base red and candidate wave
        env:
          PERF15_EXPECTED_TREE: 3bd356e1f0211b2afe72d5548bc5467689319f6b
          PERF15_PATCH_SHA256: fefe9f4c6c613289e8f90f25d01e8a9c63288fe196eab44478b8e8e78692f7de
        run: python3 tools/perf15/hosted.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf15-catalog-refresh-${{ github.run_id }}
          path: ${{ runner.temp }}/perf15
