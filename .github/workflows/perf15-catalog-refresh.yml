name: perf15-catalog-refresh-coordinator
on:
  push:
    branches: [fix/catalog-refresh-coordinator]
    paths: ['.github/workflows/perf15-catalog-refresh.yml', 'tools/perf15/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bounded:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Install isolated fixture dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux
          tmux -V
      - name: Exact source, compile, named base red and candidate wave
        env:
          PERF15_EXPECTED_TREE: 98e294185c30b94052ba6bb80d792d3a898bf3c5
          PERF15_PATCH_SHA256: 63e97c4a09376cbb7c617d57f4648f9e447f8b956be2c41371615d7a336ee1b7
        run: python3 tools/perf15/hosted.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf15-catalog-refresh-${{ github.run_id }}
          path: ${{ runner.temp }}/perf15
