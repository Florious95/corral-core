name: perf16-n7-publication
on:
  pull_request:
    paths:
      - .github/workflows/perf16-n7-publication.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  n7:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 4769dbfae7b976de5a74650b1aeb96ed23260814
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Apply exact N7 patch to frozen delivery base
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/perf16-n7"
          python3 - <<'PYTHON'
          import base64,gzip,hashlib,os,subprocess
          from pathlib import Path
          patch=gzip.decompress(base64.b64decode(''))
          assert hashlib.sha256(patch).hexdigest()=='69393d2ece28c34f47e5da56fd0074f8b6621be9303312b480d411af7bc3db55'
          out=Path(os.environ['RUNNER_TEMP'])/'perf16-n7'
          (out/'n7.patch').write_bytes(patch)
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()=='4769dbfae7b976de5a74650b1aeb96ed23260814'
          subprocess.run(['git','apply','--index',str(out/'n7.patch')],check=True)
          expected={'internal/api/server.go': '73f4985df9184cbcb5ada12d2089053aa77caac0', 'internal/api/ws_conn.go': 'a8551277f363f9e8ee344bdceffbb23b0956479c', 'internal/api/overflow_recovery_scenario_test.go': 'cb24d7bddb5c7c34298ee691a6ba03b9f2168d48', 'internal/api/overflow_recovery_publication_test.go': '63aed4e46927208ad752f1a8f3de715cc05102c4'}
          for path,blob in expected.items():
              assert subprocess.check_output(['git','rev-parse',':'+path],text=True).strip()==blob
          (out/'identity.txt').write_text('source_sha='+subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()+'\ntested_tree='+subprocess.check_output(['git','write-tree'],text=True).strip()+'\npatch_sha256='+hashlib.sha256(patch).hexdigest()+'\n')
          PYTHON
      - name: Compile only
        shell: bash
        run: |
          set -euo pipefail
          set +e
          go test -race -count=1 -run '^$' ./internal/api > "$RUNNER_TEMP/perf16-n7/compile.log" 2>&1
          rc=$?
          set -e
          cat "$RUNNER_TEMP/perf16-n7/compile.log"
          printf 'mode=compile_only_zero_tests\nexit=%s\n' "$rc" > "$RUNNER_TEMP/perf16-n7/compile.receipt"
          exit "$rc"
      - name: Install hosted tmux
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux
          tmux -V
      - name: Run N7 publication and unchanged two stage scenarios
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          while read -r label pattern parent; do
            log="$RUNNER_TEMP/perf16-n7/$label.log"
            set +e
            go test -race -count=1 -timeout 120s ./internal/api -run "$pattern" -v > "$log" 2>&1
            rc=$?
            set -e
            cat "$log"
            printf 'label=%s pattern=%s exit=%s\n' "$label" "$pattern" "$rc" >> "$RUNNER_TEMP/perf16-n7/tests.receipt"
            if [ "$rc" -ne 0 ] || [ "$(grep -c "^--- PASS: $parent " "$log")" -ne 1 ] || grep -q -- '--- SKIP:' "$log"; then failed=1; fi
            if [ "$label" != publication ] && ! grep -q -- "--- PASS: $parent/$label " "$log"; then failed=1; fi
          done <<'TESTS'
          publication ^TestConnInitPublicationAndCallbackIsolation$ TestConnInitPublicationAndCallbackIsolation
          bridge ^TestOverflowDisconnectReplayStaticOracle$/^bridge$ TestOverflowDisconnectReplayStaticOracle
          ws ^TestOverflowDisconnectReplayStaticOracle$/^ws$ TestOverflowDisconnectReplayStaticOracle
          TESTS
          exit "$failed"
      - name: Reject callback invocation under publication lock
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          from pathlib import Path
          p=Path('internal/api/ws_conn.go')
          s=p.read_text()
          old='\ts.trackersMu.Unlock()\n\tif init != nil {\n\t\tinit(c)\n\t}'
          new='\tif init != nil {\n\t\tinit(c)\n\t}\n\ts.trackersMu.Unlock()'
          assert s.count(old)==1
          p.write_text(s.replace(old,new,1))
          PYTHON
          git diff > "$RUNNER_TEMP/perf16-n7/lock-held.diff"
          set +e
          go test -race -count=1 -timeout 60s ./internal/api -run '^TestConnInitPublicationAndCallbackIsolation$' -v > "$RUNNER_TEMP/perf16-n7/lock-held.log" 2>&1
          rc=$?
          set -e
          cat "$RUNNER_TEMP/perf16-n7/lock-held.log"
          printf 'mutation=callback_lock_held exit=%s\n' "$rc" > "$RUNNER_TEMP/perf16-n7/mutation.receipt"
          test "$rc" -ne 0
          grep -q '^--- FAIL: TestConnInitPublicationAndCallbackIsolation ' "$RUNNER_TEMP/perf16-n7/lock-held.log"
          git restore --worktree -- internal/api/ws_conn.go
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf16-n7-${{ github.run_id }}
          path: ${{ runner.temp }}/perf16-n7
