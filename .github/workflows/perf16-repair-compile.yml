name: perf16-repair-compile
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/perf16-repair-compile.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 9b8fcf67ccda39cad28607be218c7808d3345bfd
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Apply frozen compile-only repair
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 9b8fcf67ccda39cad28607be218c7808d3345bfd
          mkdir -p "$RUNNER_TEMP/perf16-compile"
          cat > "$RUNNER_TEMP/perf16-compile/repair.patch" <<'PATCH'
          diff --git a/internal/api/sendq_metrics.go b/internal/api/sendq_metrics.go
          index 4d4f89f..ac297ad 100644
          --- a/internal/api/sendq_metrics.go
          +++ b/internal/api/sendq_metrics.go
          @@ -70,6 +70,15 @@ type ConnMetrics struct {
           	FramesSent             int64
           }
           
          +// ConnMetricsSnapshot is a value copy; it never copies the live metrics mutex.
          +type ConnMetricsSnapshot struct {
          +	DeltasDropped          int64
          +	SnapshotsPushed        int64
          +	SnapshotsFromResize    int64
          +	SnapshotsFromSubscribe int64
          +	FramesSent             int64
          +}
          +
           // recordDrop 记录本连接因队列满丢弃的 delta。
           func (m *ConnMetrics) recordDrop() {
           	m.mu.Lock()
          diff --git a/internal/api/ws_handler.go b/internal/api/ws_handler.go
          index b6265bd..327ced1 100644
          --- a/internal/api/ws_handler.go
          +++ b/internal/api/ws_handler.go
          @@ -184,7 +184,6 @@ func (c *wsConn) handleSubscribe(s protocol.Subscribe) {
           	go c.relay(subCtx, sub, ch)
           
           	var snap []byte
          -	var err error
           	if c.snapshotFn != nil {
           		snap, err = c.snapshotFn(c.ctx, br)
           	} else {
          PATCH
          git apply --index "$RUNNER_TEMP/perf16-compile/repair.patch"
          printf 'source_sha=%s\ntested_tree=%s\nmode=compile_only_zero_tests\n' "$(git rev-parse HEAD)" "$(git write-tree)" | tee "$RUNNER_TEMP/perf16-compile/identity.txt"
          sha256sum "$RUNNER_TEMP/perf16-compile/repair.patch" | tee -a "$RUNNER_TEMP/perf16-compile/identity.txt"
      - name: Compile API and bridge tests without executing tests
        shell: bash
        run: |
          set -euo pipefail
          set +e
          go test -race -count=1 -run '^$' ./internal/api ./internal/bridge 2>&1 | tee "$RUNNER_TEMP/perf16-compile/compile.log"
          rc=${PIPESTATUS[0]}
          set -e
          printf 'command=go test -race -count=1 -run ^$ ./internal/api ./internal/bridge\nexit=%s\n' "$rc" | tee "$RUNNER_TEMP/perf16-compile/receipt.txt"
          exit "$rc"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf16-repair-compile-${{ github.run_id }}
          path: ${{ runner.temp }}/perf16-compile
