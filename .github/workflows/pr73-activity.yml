name: PR73 activity projection

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  activity-projection:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare ephemeral Android debug keystore
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi

      - name: Run T-A matrix and Compose tests
        shell: bash
        run: |
          set +e
          cd app
          ./gradlew --no-daemon --rerun-tasks \
            -Pkotlin.compiler.execution.strategy=in-process \
            :app:testDebugUnitTest \
            --tests 'dev.agentmirror.app.ui.ExternalSessionStatusUiTest' \
            --tests 'dev.agentmirror.app.workspace.L2UnknownStatusTest' \
            --tests 'dev.agentmirror.app.workspace.PiWorkingDtoProjectionTest' \
            2>&1 | tee "$GITHUB_WORKSPACE/gradle.log"
          rc=${PIPESTATUS[0]}
          executed=$(grep -cE '^> Task ' "$GITHUB_WORKSPACE/gradle.log" || true)
          up_to_date=$(grep -c 'UP-TO-DATE' "$GITHUB_WORKSPACE/gradle.log" || true)
          result_dir="$GITHUB_WORKSPACE/app/app/build/test-results/testDebugUnitTest"
          read -r tests failures errors skipped <<< "$(python3 - "$result_dir" <<'PY'
import glob
import os
import sys
import xml.etree.ElementTree as ET

values = [0, 0, 0, 0]
for path in glob.glob(os.path.join(sys.argv[1], "*.xml")):
    root = ET.parse(path).getroot()
    for index, name in enumerate(("tests", "failures", "errors", "skipped")):
        values[index] += int(root.attrib.get(name, "0"))
print(*values)
PY
)"
          {
            echo "### PR73 activity test"
            echo "- command_exit: $rc"
            echo "- executed_task_lines: $executed"
            echo "- up_to_date_task_lines: $up_to_date"
            echo "- junit_tests: ${tests:-0}"
            echo "- junit_failures: ${failures:-0}"
            echo "- junit_errors: ${errors:-0}"
            echo "- junit_skipped: ${skipped:-0}"
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"
