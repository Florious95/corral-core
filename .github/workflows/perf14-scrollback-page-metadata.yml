name: perf14-scrollback-page-metadata

on:
  pull_request:
    branches: [main]
    paths:
      - "internal/api/**"
      - "internal/bridge/**"
      - ".team/perf14-candidate.patch"
      - ".github/workflows/perf14-scrollback-page-metadata.yml"

permissions:
  contents: read

env:
  BASE_SHA: b98504e742ed1e7c7475767c512934b07eac592b
  CANDIDATE_PATCH: .team/perf14-candidate.patch
  CANDIDATE_PATCH_SHA256: cd19bfbb484ac6b010d44f69e8f327ce8cb5dbe428eb2a7277a0a16942522d6b

jobs:
  perf14:
    name: Frozen-base FAIL and candidate PASS
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Go from module
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Ensure hosted tmux
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v tmux >/dev/null 2>&1; then brew install tmux; fi
          command -v tmux
          tmux -V
          command -v python3

      - name: Verify clean PR head and candidate patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test -z "$(git status --porcelain --untracked-files=all)"
          test -f "$CANDIDATE_PATCH"
          test "$(shasum -a 256 "$CANDIDATE_PATCH" | awk '{print $1}')" = "$CANDIDATE_PATCH_SHA256"
          mkdir -p "$RUNNER_TEMP/perf14"
          printf 'head=%s\nbase=%s\npatch=%s\npatch_sha256=%s\n' \
            "$(git rev-parse HEAD)" "$BASE_SHA" "$CANDIDATE_PATCH" "$CANDIDATE_PATCH_SHA256" \
            | tee "$RUNNER_TEMP/perf14/checkout.txt"

      - name: Apply exact candidate patch
        shell: bash
        run: |
          set -euo pipefail
          git apply --check "$CANDIDATE_PATCH"
          git apply "$CANDIDATE_PATCH"
          git diff --check
          test -f internal/api/perf14_independent_oracle_test.go
          test -f internal/api/perf14_real_page_oracle_test.go
          test -f internal/api/scrollback_range_test.go
          git add -- internal/api internal/bridge
          git diff --cached --check
          printf 'candidate_tree=%s\n' "$(git write-tree)" | tee "$RUNNER_TEMP/perf14/candidate-tree.txt"
          cp "$CANDIDATE_PATCH" "$RUNNER_TEMP/perf14/candidate.patch"
          printf 'candidate_patch=applied\n' | tee "$RUNNER_TEMP/perf14/candidate-receipt.txt"

      - name: "FAIL — frozen base bounded-work oracle"
        shell: bash
        run: |
          set -euo pipefail
          old="$RUNNER_TEMP/perf14-base"
          git worktree add --detach "$old" "$BASE_SHA"
          cp internal/api/perf14_independent_oracle_test.go "$old/internal/api/perf14_independent_oracle_test.go"
          cp internal/api/perf14_real_page_oracle_test.go "$old/internal/api/perf14_real_page_oracle_test.go"
          log="$RUNNER_TEMP/perf14/frozen-base-FAIL.log"
          set +e
          (
            cd "$old"
            go test -race -count=1 -timeout=12m ./internal/api \
              -run '^TestPerf14(HandlerBoundedCaptureWork|HandlerRangeTable|EmptyHistoryDoesNotCaptureScreen|PageLineContentOracle|MetadataFailureDoesNotCapture)$' -v
          ) 2>&1 | tee "$log"
          rc=${PIPESTATUS[0]}
          set -e
          printf 'label=FAIL\nbase=%s\ncommand=go test -race -count=1 -timeout=12m ./internal/api -run TestPerf14HandlerBoundedCaptureWork|HandlerRangeTable|EmptyHistoryDoesNotCaptureScreen|PageLineContentOracle|MetadataFailureDoesNotCapture -v\nexit=%s\n' "$BASE_SHA" "$rc" | tee "$RUNNER_TEMP/perf14/frozen-base-FAIL-receipt.txt"
          test "$rc" -ne 0
          grep -q -- '--- FAIL: TestPerf14HandlerBoundedCaptureWork' "$log"
          grep -q -- 'capture-pane' "$log"
          grep -q -- 'metadata=0' "$log"

      - name: "PASS — candidate #14 oracle and scrollback compatibility"
        shell: bash
        env:
          PERF14_REAL_ROOT: ${{ runner.temp }}/perf14-real
        run: |
          set -euo pipefail
          mkdir -p "$PERF14_REAL_ROOT"
          log="$RUNNER_TEMP/perf14/candidate-PASS.log"
          {
            go test -race -count=1 -timeout=15m ./internal/api \
              -run '^(TestPerf14(HandlerBoundedCaptureWork|HandlerRangeTable|EmptyHistoryDoesNotCaptureScreen|PageLineContentOracle|ZeroCountRejectedBeforeTmux|MetadataFailureDoesNotCapture|RealStaticPagesAndActualGeometry)|TestScrollbackPageUsesBoundedMetadataAndOneCapture|TestCountLinesTreatsNonEmptyBodyWithoutLFAsOne|TestScrollbackRangeForBoundaries|TestScrollbackTrimPreservesTrailingBlankRows|TestScrollback(ConvergedRange|ExactHeaderBytes))$' -v
            go test -race -count=1 -timeout=8m ./internal/bridge \
              -run '^TestScrollbackPagingRange$' -v
          } 2>&1 | tee "$log"
          expected=(
            TestPerf14HandlerBoundedCaptureWork
            TestPerf14HandlerRangeTable
            TestPerf14EmptyHistoryDoesNotCaptureScreen
            TestPerf14PageLineContentOracle
            TestPerf14ZeroCountRejectedBeforeTmux
            TestPerf14MetadataFailureDoesNotCapture
            TestPerf14RealStaticPagesAndActualGeometry
            TestScrollbackPageUsesBoundedMetadataAndOneCapture
            TestCountLinesTreatsNonEmptyBodyWithoutLFAsOne
            TestScrollbackRangeForBoundaries
            TestScrollbackTrimPreservesTrailingBlankRows
            TestScrollbackConvergedRange
            TestScrollbackExactHeaderBytes
            TestScrollbackPagingRange
          )
          for name in "${expected[@]}"; do
            test "$(grep -Ec -- "^--- PASS: $name \\(" "$log")" -eq 1
          done
          ! grep -q -- 'SKIP' "$log"
          printf 'label=PASS\nhead=%s\ncommand=scrollback-only go test -race -count=1\nexit=0\n' "$(git rev-parse HEAD)" | tee "$RUNNER_TEMP/perf14/candidate-PASS-receipt.txt"

      - name: "BASELINE — full API/bridge race evidence (not #14 acceptance)"
        id: baseline-suite
        continue-on-error: true
        shell: bash
        env:
          PERF14_REAL_ROOT: ${{ runner.temp }}/perf14-real-baseline
        run: |
          set -uo pipefail
          mkdir -p "$PERF14_REAL_ROOT"
          log="$RUNNER_TEMP/perf14/full-suite-baseline.log"
          go test -race -count=1 -timeout=15m ./internal/api ./internal/bridge -v 2>&1 | tee "$log"
          rc=${PIPESTATUS[0]}
          printf 'label=BASELINE_NOT_ACCEPTANCE\nhead=%s\ncommand=go test -race -count=1 -timeout=15m ./internal/api ./internal/bridge -v\nexit=%s\n' "$(git rev-parse HEAD)" "$rc" | tee "$RUNNER_TEMP/perf14/full-suite-baseline-receipt.txt"
          grep -E -- '^--- (PASS|FAIL|SKIP):' "$log" > "$RUNNER_TEMP/perf14/full-suite-named-results.txt" || true
          exit "$rc"

      - name: Upload named FAIL/PASS evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf14-scrollback-page-metadata-${{ github.run_id }}
          path: ${{ runner.temp }}/perf14
