name: perf14-pr20-source-combination

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".team/perf14-candidate.patch"
      - ".team/perf14-author-tests.patch"
      - ".github/workflows/perf14-pr20-combination.yml"
      - "internal/api/**"
      - "internal/bridge/**"

permissions:
  contents: read

env:
  BASE_SHA: b98504e742ed1e7c7475767c512934b07eac592b
  PR20_SOURCE_SHA: 1fa3b651c613f7b973b5187429d8e9e50d9d3d45
  CANDIDATE_PATCH: .team/perf14-candidate.patch
  CANDIDATE_PATCH_SHA256: cd19bfbb484ac6b010d44f69e8f327ce8cb5dbe428eb2a7277a0a16942522d6b
  AUTHOR_TEST_PATCH: .team/perf14-author-tests.patch
  AUTHOR_TEST_PATCH_SHA256: 29a74876424cd086693ca43a3b60967f6690d97f6f23506dc1eba7c3154d616a
  EXPECTED_COMBO_TREE: 4049519ea481d6245f6a6de77f17d8f90a968b65
  EXPECTED_FINAL_TEST_TREE: c4f516769e4d07bffc359f980ff2fa9b5c2114ca
  EXPECTED_WS_HANDLER_BLOB: 4c09f523e85c63643effeecb48246f6da20856a3
  EXPECTED_BRIDGE_BLOB: f458bc6e30d6918fd8c2e9c30eceb3af9a9ec19d
  CARRIER_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

jobs:
  perf14-pr20:
    name: PERF14 exact PR20 dependency combination
    runs-on: macos-14
    timeout-minutes: 55
    steps:
      - name: Checkout exact PR24 carrier head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CARRIER_HEAD }}
          fetch-depth: 0

      - name: Set up Go from module
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Ensure hosted tmux and Python
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v tmux >/dev/null 2>&1; then brew install tmux; fi
          command -v tmux
          tmux -V
          command -v python3

      - name: Verify carrier and patch identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CARRIER_HEAD"
          test "${#CARRIER_HEAD}" = 40
          test -z "$(git status --porcelain --untracked-files=all)"
          test -f "$CANDIDATE_PATCH"
          test "$(shasum -a 256 "$CANDIDATE_PATCH" | awk '{print $1}')" = "$CANDIDATE_PATCH_SHA256"
          test -f "$AUTHOR_TEST_PATCH"
          test "$(shasum -a 256 "$AUTHOR_TEST_PATCH" | awk '{print $1}')" = "$AUTHOR_TEST_PATCH_SHA256"
          git fetch --no-tags origin "$PR20_SOURCE_SHA"
          mkdir -p "$RUNNER_TEMP/perf14-combo"
          printf 'carrier_head=%s\ncarrier_tree=%s\nsource_sha=%s\nproduct_patch=%s\nproduct_patch_sha256=%s\nauthor_test_patch=%s\nauthor_test_patch_sha256=%s\n' \
            "$CARRIER_HEAD" "$(git rev-parse HEAD^{tree})" "$PR20_SOURCE_SHA" "$CANDIDATE_PATCH" "$CANDIDATE_PATCH_SHA256" "$AUTHOR_TEST_PATCH" "$AUTHOR_TEST_PATCH_SHA256" \
            | tee "$RUNNER_TEMP/perf14-combo/checkout.txt"

      - name: Prove real tmux fixture and owned cleanup oracle
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/perf14-combo"
          fixture="$root/real-tmux-fixture"
          mkdir -p "$fixture"
          cat > "$fixture/emit.sh" <<'EOF'
          #!/bin/sh
          printf 'PERF14_REAL_TMUX_FIXTURE\n'
          exec sleep 30
          EOF
          chmod 700 "$fixture/emit.sh"
          cat > "$fixture/cleanup_oracle.py" <<'PY'
          import argparse, errno, json, os, pathlib, socket, stat, tempfile
          STALE={errno.ECONNREFUSED, errno.ENOENT}
          class CleanupError(RuntimeError): pass
          def ident(path):
              st=os.lstat(path)
              return {'dev':st.st_dev,'ino':st.st_ino,'mode':st.st_mode,'is_socket':stat.S_ISSOCK(st.st_mode)}
          def classify(err):
              if err is None: return 'live'
              if err in STALE: return 'stale'
              raise CleanupError(f'unexpected connect errno={err} ({os.strerror(err)})')
          def state(path):
              try: before=ident(path)
              except FileNotFoundError: return 'stale',errno.ENOENT,None
              if not before['is_socket']: raise CleanupError(f'not a socket lstat={before}')
              s=socket.socket(socket.AF_UNIX,socket.SOCK_STREAM); s.settimeout(.2)
              try:
                  s.connect(path)
              except socket.timeout as e: raise CleanupError(f'connect timeout path={path}') from e
              except OSError as e: return classify(e.errno),e.errno,before
              else: return classify(None),None,before
              finally: s.close()
          def cleanup(path,expected,receipt):
              path=os.path.abspath(path); expected=os.path.abspath(expected)
              if path!=expected or pathlib.Path(path).parent!=pathlib.Path(expected).parent: raise CleanupError(f'path identity mismatch path={path} expected={expected}')
              status,err,before=state(path); out={'path':path,'expected':expected,'connect_state':status,'connect_errno':err,'lstat_before':before}
              if status=='live': raise CleanupError(json.dumps(out,sort_keys=True))
              if before is not None:
                  after=ident(path); out['lstat_before_delete']=after
                  if after!=before: raise CleanupError(f'identity changed before delete: {out}')
                  os.unlink(path); out['deleted']=True
              else: out['deleted']=False
              out['exists_after']=os.path.lexists(path)
              if out['exists_after']: raise CleanupError(f'socket remains: {out}')
              pathlib.Path(receipt).write_text(json.dumps(out,sort_keys=True)+'\n')
          def self_test(receipt):
              with tempfile.TemporaryDirectory() as d:
                  d=pathlib.Path(d); live=d/'live'; s=socket.socket(socket.AF_UNIX,socket.SOCK_STREAM); s.bind(str(live)); s.listen(1)
                  assert state(str(live))[0]=='live'; s.close(); live.unlink()
                  stale=d/'stale'; s=socket.socket(socket.AF_UNIX,socket.SOCK_STREAM); s.bind(str(stale)); s.close(); got=state(str(stale)); assert got[0]=='stale' and got[1]==errno.ECONNREFUSED and got[2]['is_socket']; stale.unlink()
                  assert state(str(d/'missing'))[:2]==('stale',errno.ENOENT)
                  regular=d/'regular'; regular.write_text('not a socket')
                  try: state(str(regular)); raise AssertionError('regular accepted')
                  except CleanupError: pass
                  for bad in (errno.ETIMEDOUT,errno.EACCES):
                      try: classify(bad); raise AssertionError(f'errno {bad} accepted')
                      except CleanupError: pass
              pathlib.Path(receipt).write_text(json.dumps({'live':'PASS','closed_refused':'PASS','missing':'PASS','regular_rejected':'PASS','timeout_other_errno_rejected':'PASS'})+'\n')
          p=argparse.ArgumentParser(); p.add_argument('--self-test',action='store_true'); p.add_argument('--socket'); p.add_argument('--expected'); p.add_argument('--receipt',required=True); a=p.parse_args()
          if a.self_test: self_test(a.receipt)
          elif a.socket and a.expected: cleanup(a.socket,a.expected,a.receipt)
          else: raise SystemExit('cleanup_oracle: invalid arguments')
          PY
          chmod 700 "$fixture/emit.sh" "$fixture/cleanup_oracle.py"
          python3 "$fixture/cleanup_oracle.py" --self-test --receipt "$root/cleanup-oracle-self-test.json"
          env -u TMUX TMUX_TMPDIR=. tmux -S "$fixture/socket" -f /dev/null new-session -d -x 40 -y 10 -s perf14-proof "$fixture/emit.sh"
          tmux -S "$fixture/socket" list-panes -a -F '#{session_name}|#{pane_id}|#{pane_width}x#{pane_height}' | tee "$root/tmux-fixture-list.txt"
          tmux -S "$fixture/socket" capture-pane -p -t %0 | tee "$root/tmux-fixture-capture.txt"
          grep -Fx 'PERF14_REAL_TMUX_FIXTURE' "$root/tmux-fixture-capture.txt"
          tmux -S "$fixture/socket" kill-server
          for _ in $(seq 1 40); do test ! -e "$fixture/socket" && break; sleep 0.05; done
          python3 "$fixture/cleanup_oracle.py" --socket "$fixture/socket" --expected "$fixture/socket" --receipt "$root/cleanup-oracle.json"
          test ! -e "$fixture/socket"
          printf 'fixture=PASS\n' | tee "$root/tmux-fixture.status"

      - name: Build exact PR20 plus PERF14 tested tree
        shell: bash
        run: |
          set -euo pipefail
          combo="$RUNNER_TEMP/perf14-combo-tree"
          git worktree add --detach "$combo" "$PR20_SOURCE_SHA"
          git -C "$combo" apply --check "$GITHUB_WORKSPACE/$CANDIDATE_PATCH"
          git -C "$combo" apply "$GITHUB_WORKSPACE/$CANDIDATE_PATCH"
          git -C "$combo" add -- internal/api internal/bridge
          git -C "$combo" diff --cached --check
          product_tree=$(git -C "$combo" write-tree)
          test "$product_tree" = "$EXPECTED_COMBO_TREE"
          test "$(git -C "$combo" hash-object internal/api/ws_handler.go)" = "$EXPECTED_WS_HANDLER_BLOB"
          test "$(git -C "$combo" hash-object internal/bridge/bridge.go)" = "$EXPECTED_BRIDGE_BLOB"
          grep -F 'mu sync.Mutex' "$combo/internal/api/sendq_metrics.go"
          grep -F 'func (m *ConnMetrics) snapshot()' "$combo/internal/api/sendq_metrics.go"
          grep -F 'c.connMetrics.snapshot()' "$combo/internal/api/ws_conn.go"
          git -C "$combo" apply --check "$GITHUB_WORKSPACE/$AUTHOR_TEST_PATCH"
          git -C "$combo" apply "$GITHUB_WORKSPACE/$AUTHOR_TEST_PATCH"
          git -C "$combo" add -- internal/api/scrollback_page_metadata_test.go
          git -C "$combo" diff --cached --check
          final_tree=$(git -C "$combo" write-tree)
          test "$final_tree" = "$EXPECTED_FINAL_TEST_TREE"
          synthetic=$(GIT_AUTHOR_NAME='AgentMirror PERF14 validation' \
            GIT_AUTHOR_EMAIL='perf14-validation@agentmirror.invalid' \
            GIT_AUTHOR_DATE='2000-01-01T00:00:00Z' \
            GIT_COMMITTER_NAME='AgentMirror PERF14 validation' \
            GIT_COMMITTER_EMAIL='perf14-validation@agentmirror.invalid' \
            GIT_COMMITTER_DATE='2000-01-01T00:00:00Z' \
            git -C "$combo" commit-tree "$final_tree" -p "$PR20_SOURCE_SHA" <<'EOF'
          PERF14 exact PR20 source plus product/test patches; validation-only synthetic commit.
          EOF
          )
          printf '%s\n' "$synthetic" > "$RUNNER_TEMP/perf14-combo/synthetic_commit.txt"
          git -C "$combo" reset --hard "$synthetic"
          test -z "$(git -C "$combo" status --porcelain --untracked-files=all)"
          test "$(git -C "$combo" show -s --format=%an "$synthetic")" = 'AgentMirror PERF14 validation'
          test "$(git -C "$combo" show -s --format=%ae "$synthetic")" = 'perf14-validation@agentmirror.invalid'
          test "$(git -C "$combo" show -s --format=%cn "$synthetic")" = 'AgentMirror PERF14 validation'
          test "$(git -C "$combo" show -s --format=%ce "$synthetic")" = 'perf14-validation@agentmirror.invalid'
          test "$(git -C "$combo" show -s --format=%P "$synthetic")" = "$PR20_SOURCE_SHA"
          test "$(git -C "$combo" show -s --format=%T "$synthetic")" = "$final_tree"
          printf 'source_sha=%s\nproduct_combo_tree=%s\nfinal_tested_tree=%s\nsynthetic_commit=%s\nsynthetic_parent=%s\nsynthetic_tree=%s\nsynthetic_author=AgentMirror PERF14 validation <perf14-validation@agentmirror.invalid>\nsynthetic_committer=AgentMirror PERF14 validation <perf14-validation@agentmirror.invalid>\nsynthetic_date=2000-01-01T00:00:00Z\nsynthetic_validation_only=true\nws_handler_blob=%s\nbridge_blob=%s\n' \
            "$PR20_SOURCE_SHA" "$product_tree" "$final_tree" "$synthetic" "$PR20_SOURCE_SHA" "$final_tree" "$EXPECTED_WS_HANDLER_BLOB" "$EXPECTED_BRIDGE_BLOB" \
            | tee "$RUNNER_TEMP/perf14-combo/tree-receipt.txt"

      - name: Build frozen b985 reference binary
        shell: bash
        run: |
          set -euo pipefail
          old="$RUNNER_TEMP/perf14-base"
          git worktree add --detach "$old" "$BASE_SHA"
          out="$RUNNER_TEMP/perf14-combo/agentmirrord-r0-b985-darwin-arm64"
          (cd "$old" && CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -trimpath -buildvcs=true -o "$out" ./cmd/agentmirrord)
          file "$out" | tee "$RUNNER_TEMP/perf14-combo/base-file.txt"
          grep -Eq 'Mach-O 64-bit arm64' "$RUNNER_TEMP/perf14-combo/base-file.txt"
          go version -m "$out" | tee "$RUNNER_TEMP/perf14-combo/base-build-info.txt"
          python3 - "$RUNNER_TEMP/perf14-combo/base-build-info.txt" "$BASE_SHA" <<'PY'
          import pathlib, re, sys
          text=pathlib.Path(sys.argv[1]).read_text(); rev=sys.argv[2]
          for key,val in [('vcs','git'),('vcs.revision',rev),('vcs.modified','false')]:
              if not re.search(r'^\s+build\s+'+re.escape(key)+r'='+re.escape(val)+r'$',text,re.M): raise SystemExit(f'missing base {key}={val}')
          print('base_embedded_vcs=PASS revision='+rev+' modified=false')
          PY
          shasum -a 256 "$out" | tee "$RUNNER_TEMP/perf14-combo/base-sha256.txt"
          wc -c < "$out" | tr -d ' ' | tee "$RUNNER_TEMP/perf14-combo/base-bytes.txt"

      - name: "FAIL — frozen b985 independent PERF14 red"
        shell: bash
        run: |
          set -euo pipefail
          combo="$RUNNER_TEMP/perf14-combo-tree"; old="$RUNNER_TEMP/perf14-base"; log="$RUNNER_TEMP/perf14-combo/frozen-base-FAIL.jsonl"
          cp "$combo/internal/api/perf14_independent_oracle_test.go" "$old/internal/api/perf14_independent_oracle_test.go"
          cp "$combo/internal/api/perf14_real_page_oracle_test.go" "$old/internal/api/perf14_real_page_oracle_test.go"
          set +e
          (cd "$old" && go test -json -race -count=1 -timeout=12m ./internal/api -run '^TestPerf14(HandlerBoundedCaptureWork|HandlerRangeTable|EmptyHistoryDoesNotCaptureScreen|PageLineContentOracle|MetadataFailureDoesNotCapture)$') > "$log" 2>&1
          rc=$?; set -e
          python3 - "$log" <<'PY'
          import json, pathlib, sys
          names=['TestPerf14HandlerBoundedCaptureWork','TestPerf14HandlerRangeTable','TestPerf14EmptyHistoryDoesNotCaptureScreen','TestPerf14PageLineContentOracle','TestPerf14MetadataFailureDoesNotCapture']
          events=[json.loads(line) for line in pathlib.Path(sys.argv[1]).read_text().splitlines() if line.startswith('{')]
          for name in names:
              root=[e for e in events if e.get('Test')==name]
              if sum(e.get('Action')=='run' for e in root)!=1: raise SystemExit(name+' RUN count')
              if sum(e.get('Action')=='fail' for e in root)!=1: raise SystemExit(name+' FAIL count')
              if any(e.get('Action')=='skip' for e in root): raise SystemExit(name+' SKIP')
          print('base_roots=FAIL count=5 run=5 fail=5 skip=0')
          PY
          printf 'label=FAIL\nbase=%s\nexit=%s\nroots=5 RUN=5 FAIL=5 SKIP=0\n' "$BASE_SHA" "$rc" | tee "$RUNNER_TEMP/perf14-combo/frozen-base-FAIL-receipt.txt"
          test "$rc" -ne 0
          grep -q 'capture-pane' "$log"; grep -q 'metadata=0' "$log"

      - name: "PASS — exact PR20 plus PERF14 fourteen named roots"
        shell: bash
        env:
          PERF14_REAL_ROOT: ${{ runner.temp }}/perf14-real
        run: |
          set -euo pipefail
          combo="$RUNNER_TEMP/perf14-combo-tree"; log="$RUNNER_TEMP/perf14-combo/candidate-PASS.jsonl"
          set +e
          (cd "$combo" && go test -json -race -count=1 -timeout=15m ./internal/api -run '^(TestPerf14HandlerBoundedCaptureWork|TestPerf14HandlerRangeTable|TestPerf14EmptyHistoryDoesNotCaptureScreen|TestPerf14PageLineContentOracle|TestPerf14ZeroCountRejectedBeforeTmux|TestPerf14MetadataFailureDoesNotCapture|TestPerf14RealStaticPagesAndActualGeometry|TestScrollbackPageUsesBoundedMetadataAndOneCapture|TestCountLinesTreatsNonEmptyBodyWithoutLFAsOne|TestScrollbackRangeForBoundaries|TestScrollbackTrimPreservesTrailingBlankRows|TestScrollbackConvergedRange|TestScrollbackExactHeaderBytes)$') > "$log" 2>&1
          api_rc=$?
          (cd "$combo" && go test -json -race -count=1 -timeout=8m ./internal/bridge -run '^TestScrollbackPagingRange$') >> "$log" 2>&1
          bridge_rc=$?
          set -e
          test "$api_rc" = 0; test "$bridge_rc" = 0
          python3 - "$log" <<'PY'
          import json, pathlib, sys
          names=['TestPerf14HandlerBoundedCaptureWork','TestPerf14HandlerRangeTable','TestPerf14EmptyHistoryDoesNotCaptureScreen','TestPerf14PageLineContentOracle','TestPerf14ZeroCountRejectedBeforeTmux','TestPerf14MetadataFailureDoesNotCapture','TestPerf14RealStaticPagesAndActualGeometry','TestScrollbackPageUsesBoundedMetadataAndOneCapture','TestCountLinesTreatsNonEmptyBodyWithoutLFAsOne','TestScrollbackRangeForBoundaries','TestScrollbackTrimPreservesTrailingBlankRows','TestScrollbackConvergedRange','TestScrollbackExactHeaderBytes','TestScrollbackPagingRange']
          events=[json.loads(line) for line in pathlib.Path(sys.argv[1]).read_text().splitlines() if line.startswith('{')]
          for name in names:
              root=[e for e in events if e.get('Test')==name]
              assert sum(e.get('Action')=='run' for e in root)==1, name+' RUN'
              assert sum(e.get('Action')=='pass' for e in root)==1, name+' PASS'
              assert not any(e.get('Action') in ('fail','skip') for e in root), name+' FAIL/SKIP'
          print('candidate_roots=PASS count=14 run=14 pass=14 skip=0')
          PY
          printf 'label=PASS\nsource=%s\nproduct_combo_tree=%s\nfinal_tested_tree=%s\nexit=0\n' "$PR20_SOURCE_SHA" "$EXPECTED_COMBO_TREE" "$EXPECTED_FINAL_TEST_TREE" | tee "$RUNNER_TEMP/perf14-combo/candidate-PASS-receipt.txt"

      - name: "PASS — compatibility roots"
        shell: bash
        run: |
          set -euo pipefail
          combo="$RUNNER_TEMP/perf14-combo-tree"; log="$RUNNER_TEMP/perf14-combo/compat-PASS.jsonl"
          set +e
          (cd "$combo" && go test -json -race -count=1 -timeout=8m ./internal/api -run '^(TestAuthGoodToken|TestListReturnsFullListing)$') > "$log" 2>&1
          rc=$?; set -e
          python3 - "$log" <<'PY'
          import json, pathlib, sys
          names=['TestAuthGoodToken','TestListReturnsFullListing']
          events=[json.loads(line) for line in pathlib.Path(sys.argv[1]).read_text().splitlines() if line.startswith('{')]
          for name in names:
              root=[e for e in events if e.get('Test')==name]
              if sum(e.get('Action')=='run' for e in root)!=1: raise SystemExit(name+' RUN count')
              if sum(e.get('Action')=='pass' for e in root)!=1: raise SystemExit(name+' PASS count')
              if any(e.get('Action') in ('fail','skip') for e in root): raise SystemExit(name+' FAIL/SKIP')
          print('compat_roots=PASS count=2 run=2 pass=2 skip=0')
          PY
          test "$rc" = 0
          printf 'label=PASS\nroots=TestAuthGoodToken,TestListReturnsFullListing\nRUN=2\nPASS=2\nSKIP=0\nexit=%s\n' "$rc" | tee "$RUNNER_TEMP/perf14-combo/compat-PASS-receipt.txt"

      - name: Build tested combination Darwin arm64 candidate binary
        shell: bash
        run: |
          set -euo pipefail
          combo="$RUNNER_TEMP/perf14-combo-tree"; out="$RUNNER_TEMP/perf14-combo/agentmirrord-r1-pr20-combination-darwin-arm64"
          (cd "$combo" && CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -trimpath -buildvcs=true -o "$out" ./cmd/agentmirrord)
          file "$out" | tee "$RUNNER_TEMP/perf14-combo/candidate-file.txt"
          grep -Eq 'Mach-O 64-bit arm64' "$RUNNER_TEMP/perf14-combo/candidate-file.txt"
          go version -m "$out" | tee "$RUNNER_TEMP/perf14-combo/candidate-build-info.txt"
          python3 - "$RUNNER_TEMP/perf14-combo/candidate-build-info.txt" "$(cat "$RUNNER_TEMP/perf14-combo/synthetic_commit.txt")" <<'PY'
          import pathlib, re, sys
          text=pathlib.Path(sys.argv[1]).read_text(); rev=sys.argv[2].strip()
          for key,val in [('GOOS','darwin'),('GOARCH','arm64'),('vcs','git'),('vcs.revision',rev),('vcs.modified','false')]:
              if not re.search(r'^\s+build\s+'+re.escape(key)+r'='+re.escape(val)+r'$',text,re.M): raise SystemExit(f'missing {key}={val}')
          print('candidate_embedded_vcs=PASS synthetic_commit='+rev)
          PY
          shasum -a 256 "$out" | tee "$RUNNER_TEMP/perf14-combo/candidate-sha256.txt"
          wc -c < "$out" | tr -d ' ' | tee "$RUNNER_TEMP/perf14-combo/candidate-bytes.txt"
          python3 - "$RUNNER_TEMP/perf14-combo" <<'PY'
          import hashlib,json,pathlib,subprocess,sys
          r=pathlib.Path(sys.argv[1]); git=lambda *a: subprocess.check_output(['git','-C',str(r/'../perf14-combo-tree'),*a],text=True).strip()
          def sha(p): return hashlib.sha256(p.read_bytes()).hexdigest()
          b=r/'agentmirrord-r0-b985-darwin-arm64'; c=r/'agentmirrord-r1-pr20-combination-darwin-arm64'
          m={'source_sha':git('rev-parse','HEAD^'),'synthetic_commit':git('rev-parse','HEAD'),'product_combo_tree':'4049519ea481d6245f6a6de77f17d8f90a968b65','final_tested_tree':'c4f516769e4d07bffc359f980ff2fa9b5c2114ca','base':{'commit':'b98504e742ed1e7c7475767c512934b07eac592b','sha256':sha(b),'bytes':b.stat().st_size},'candidate':{'sha256':sha(c),'bytes':c.stat().st_size},'cleanup':'cleanup-oracle.json','candidate_oracle':'14 named roots RUN/PASS exactly once, no SKIP','compat':'2 named roots RUN/PASS exactly once, no SKIP'}
          (r/'manifest.json').write_text(json.dumps(m,indent=2)+'\n')
          PY

      - name: "BASELINE — complete API/bridge evidence (not acceptance)"
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set +e
          combo="$RUNNER_TEMP/perf14-combo-tree"; test -d "$combo" || exit 0
          (cd "$combo" && go test -race -count=1 -timeout=15m ./internal/api ./internal/bridge -v) 2>&1 | tee "$RUNNER_TEMP/perf14-combo/full-suite-baseline.log"
          rc=${PIPESTATUS[0]}; grep '^--- FAIL:' "$RUNNER_TEMP/perf14-combo/full-suite-baseline.log" > "$RUNNER_TEMP/perf14-combo/full-suite-failures.txt" || true
          printf 'label=BASELINE_NOT_ACCEPTANCE\nsource=%s\ntree=%s\nexit=%s\n' "$PR20_SOURCE_SHA" "$EXPECTED_FINAL_TEST_TREE" "$rc" | tee "$RUNNER_TEMP/perf14-combo/full-suite-baseline-receipt.txt"
          exit 0

      - name: Cleanup combination worktrees with receipt
        if: always()
        shell: bash
        run: |
          set +e
          root="$RUNNER_TEMP/perf14-combo"
          overall=0
          before="$root/worktree-list-before-cleanup.txt"
          after="$root/worktree-list-after-cleanup.txt"
          receipt="$root/worktree-cleanup.receipt"
          git worktree list --porcelain > "$before"
          : > "$receipt"
          for path in "$RUNNER_TEMP/perf14-combo-tree" "$RUNNER_TEMP/perf14-base"; do
            exists_before=0
            registered_before=0
            test -e "$path" && exists_before=1
            grep -Fqx "worktree $path" "$before" && registered_before=1
            rc=0
            if test "$exists_before" = 1 || test "$registered_before" = 1; then
              git worktree remove --force "$path"
              rc=$?
            fi
            exists_after=0
            test -e "$path" && exists_after=1
            printf 'path=%s exists_before=%s registered_before=%s remove_exit=%s exists_after=%s\n' "$path" "$exists_before" "$registered_before" "$rc" "$exists_after" >> "$receipt"
            test "$rc" = 0 || overall=1
            test "$exists_after" = 0 || overall=1
          done
          git worktree prune
          prune_rc=$?
          git worktree list --porcelain > "$after"
          printf 'prune_exit=%s\n' "$prune_rc" >> "$receipt"
          test "$prune_rc" = 0 || overall=1
          for path in "$RUNNER_TEMP/perf14-combo-tree" "$RUNNER_TEMP/perf14-base"; do
            if grep -Fqx "worktree $path" "$after"; then
              printf 'remaining=%s\n' "$path" >> "$receipt"
              overall=1
            fi
          done
          printf 'overall_exit=%s\n' "$overall" >> "$receipt"
          exit "$overall"

      - name: Upload exact combination evidence and binaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf14-pr20-combination-${{ github.run_id }}
          if-no-files-found: error
          path: ${{ runner.temp }}/perf14-combo
