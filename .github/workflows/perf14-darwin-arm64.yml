name: PERF14 Darwin arm64 binary

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/perf14-darwin-arm64.yml

permissions:
  contents: read

env:
  PERF14_PUBLIC_CHECKPOINT: 36aef2e73b65c538e94e0352e69c573ccb40ddb6
  PERF14_PUBLIC_CHECKPOINT_TREE: 31a6be0d36c5cfda366c605873511ccd1d7ec18c
  PERF14_SOURCE: 1fa3b651c613f7b973b5187429d8e9e50d9d3d45
  PERF14_SOURCE_TREE: a0c17d659665c5a2caf823fcf69dcd89f71337ea
  PERF14_CANDIDATE_PATCH: .team/perf14-candidate.patch
  PERF14_CANDIDATE_PATCH_SHA256: cd19bfbb484ac6b010d44f69e8f327ce8cb5dbe428eb2a7277a0a16942522d6b
  PERF14_AUTHOR_PATCH: .team/perf14-author-tests.patch
  PERF14_AUTHOR_PATCH_SHA256: 29a74876424cd086693ca43a3b60967f6690d97f6f23506dc1eba7c3154d616a
  PERF14_PRODUCT_COMBO_TREE: 4049519ea481d6245f6a6de77f17d8f90a968b65
  PERF14_FINAL_TESTED_TREE: c4f516769e4d07bffc359f980ff2fa9b5c2114ca
  PERF14_ARTIFACT_NAME: agentmirrord-darwin-arm64

jobs:
  build-darwin-arm64:
    name: Build PERF14 patched Darwin arm64 binary
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact public checkpoint carrier
        uses: actions/checkout@v4
        with:
          ref: 36aef2e73b65c538e94e0352e69c573ccb40ddb6
          fetch-depth: 0
      - name: Verify source and patch identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PERF14_PUBLIC_CHECKPOINT"
          test "$(git rev-parse HEAD^{tree})" = "$PERF14_PUBLIC_CHECKPOINT_TREE"
          test "$(git rev-parse --show-toplevel)" = "$GITHUB_WORKSPACE"
          test "$(git rev-parse "$PERF14_SOURCE^{tree}")" = "$PERF14_SOURCE_TREE"
          test -f "$PERF14_CANDIDATE_PATCH" && test -f "$PERF14_AUTHOR_PATCH"
          test "$(sha256sum "$PERF14_CANDIDATE_PATCH" | awk '{print $1}')" = "$PERF14_CANDIDATE_PATCH_SHA256"
          test "$(sha256sum "$PERF14_AUTHOR_PATCH" | awk '{print $1}')" = "$PERF14_AUTHOR_PATCH_SHA256"
          mkdir -p "$RUNNER_TEMP/perf14"
          {
            printf 'public_checkpoint=%s\n' "$(git rev-parse HEAD)"
            printf 'public_checkpoint_tree=%s\n' "$(git rev-parse HEAD^{tree})"
            printf 'source=%s\nsource_tree=%s\n' "$PERF14_SOURCE" "$PERF14_SOURCE_TREE"
            printf 'candidate_patch=%s\ncandidate_patch_sha256=%s\n' "$PERF14_CANDIDATE_PATCH" "$PERF14_CANDIDATE_PATCH_SHA256"
            printf 'author_patch=%s\nauthor_patch_sha256=%s\n' "$PERF14_AUTHOR_PATCH" "$PERF14_AUTHOR_PATCH_SHA256"
          } | tee "$RUNNER_TEMP/perf14/identity-receipt.txt"
      - name: Apply both patches and build actual modified source tree
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/perf14"
          source_tree="$root/source-1fa3b651"
          artifact="$root/$PERF14_ARTIFACT_NAME"
          # Use a normal clone: Go must inspect a real .git directory while the
          # source remains the exact PERF14_SOURCE commit and both patch trees.
          git clone --no-local --no-tags "$GITHUB_WORKSPACE" "$source_tree"
          git -C "$source_tree" fetch --no-tags origin "$PERF14_SOURCE:refs/remotes/origin/perf14-source"
          git -C "$source_tree" switch --detach "$PERF14_SOURCE"
          test -d "$source_tree/.git"
          test "$(git -C "$source_tree" rev-parse --show-toplevel)" = "$source_tree"
          test "$(git -C "$source_tree" rev-parse --git-dir)" = ".git"
          test "$(git -C "$source_tree" rev-parse --git-common-dir)" = ".git"
          test "$(git -C "$source_tree" rev-parse HEAD)" = "$PERF14_SOURCE"
          test "$(git -C "$source_tree" rev-parse HEAD^{tree})" = "$PERF14_SOURCE_TREE"
          test "$(sed -n 's/^module //p' "$source_tree/go.mod" | head -1)" = github.com/agentmirror/agentmirror
          test "$(sed -n 's/^package //p' "$source_tree/cmd/agentmirrord/main.go" | head -1)" = main
          git -C "$source_tree" apply --check "$GITHUB_WORKSPACE/$PERF14_CANDIDATE_PATCH"
          git -C "$source_tree" apply "$GITHUB_WORKSPACE/$PERF14_CANDIDATE_PATCH"
          git -C "$source_tree" add -A
          product_combo_tree="$(git -C "$source_tree" write-tree)"
          test "$product_combo_tree" = "$PERF14_PRODUCT_COMBO_TREE"
          git -C "$source_tree" apply --check "$GITHUB_WORKSPACE/$PERF14_AUTHOR_PATCH"
          git -C "$source_tree" apply "$GITHUB_WORKSPACE/$PERF14_AUTHOR_PATCH"
          git -C "$source_tree" add -A
          final_tested_tree="$(git -C "$source_tree" write-tree)"
          test "$final_tested_tree" = "$PERF14_FINAL_TESTED_TREE"
          git -C "$source_tree" status --porcelain > "$root/vcs-status.txt"
          test -s "$root/vcs-status.txt"
          go_mod="$(cd "$source_tree" && GOTOOLCHAIN=auto go env GOMOD)"
          test "$go_mod" = "$source_tree/go.mod"
          {
            printf 'source_dir=%s\n' "$source_tree"
            printf 'git_toplevel=%s\n' "$(git -C "$source_tree" rev-parse --show-toplevel)"
            printf 'git_dir=%s\n' "$(git -C "$source_tree" rev-parse --git-dir)"
            printf 'git_common_dir=%s\n' "$(git -C "$source_tree" rev-parse --git-common-dir)"
            printf 'source_commit=%s\nsource_tree=%s\n' "$(git -C "$source_tree" rev-parse HEAD)" "$(git -C "$source_tree" rev-parse HEAD^{tree})"
            printf 'product_combo_tree=%s\nfinal_tested_tree=%s\n' "$product_combo_tree" "$final_tested_tree"
            printf 'module=github.com/agentmirror/agentmirror\npackage=main\nmodule_file=%s\n' "$go_mod"
            printf 'go_version=%s\n' "$(cd "$source_tree" && GOTOOLCHAIN=auto go version)"
          } | tee "$root/build-input.txt"
          (
            cd "$source_tree"
            GOTOOLCHAIN=auto CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 \
              go build -trimpath -buildvcs=true -o "$artifact" ./cmd/agentmirrord
          )
          test -s "$artifact"
          file -b "$artifact" | tee "$root/file.txt"
          grep -Eq 'Mach-O 64-bit arm64' "$root/file.txt"
          go version -m "$artifact" | tee "$root/build-info.txt"
          grep -Eq '^[[:space:]]+build[[:space:]]+vcs=git$' "$root/build-info.txt"
          grep -Eq "^[[:space:]]+build[[:space:]]+vcs\\.revision=${PERF14_SOURCE}$" "$root/build-info.txt"
          grep -Eq '^[[:space:]]+build[[:space:]]+vcs\.modified=true$' "$root/build-info.txt"
          bytes="$(wc -c < "$artifact" | tr -d ' ')"
          sha256="$(sha256sum "$artifact" | awk '{print $1}')"
          export PERF14_ROOT="$root"
          export PERF14_SOURCE_TREE="$PERF14_SOURCE_TREE"
          export PERF14_PRODUCT_COMBO_TREE="$product_combo_tree"
          export PERF14_FINAL_TESTED_TREE="$final_tested_tree"
          export PERF14_ARTIFACT="$artifact"
          export PERF14_ARTIFACT_BYTES="$bytes"
          export PERF14_ARTIFACT_SHA256="$sha256"
          export PERF14_FILE_ID="$(cat "$root/file.txt")"
          export PERF14_BUILD_INFO_FILE="$root/build-info.txt"
          export PERF14_BUILD_INPUT_FILE="$root/build-input.txt"
          export PERF14_VCS_STATUS_FILE="$root/vcs-status.txt"
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          artifact = Path(os.environ["PERF14_ARTIFACT"])
          status = Path(os.environ["PERF14_VCS_STATUS_FILE"]).read_text()
          build_info = Path(os.environ["PERF14_BUILD_INFO_FILE"]).read_text()
          build_input = Path(os.environ["PERF14_BUILD_INPUT_FILE"]).read_text()
          embedded = next((line.rsplit("=", 1)[-1].strip() for line in build_info.splitlines() if "vcs.modified" in line), "")
          vcs_modified = bool(status.strip())
          if embedded not in {"true", "false"} or (embedded == "true") != vcs_modified:
              raise SystemExit(f"VCS modified mismatch: status={vcs_modified} embedded={embedded!r}")
          manifest = {
              "task_id": "perf14-scrollback-page-metadata",
              "public_checkpoint": {
                  "commit": os.environ["PERF14_PUBLIC_CHECKPOINT"],
                  "branch": "fix/scrollback-page-metadata",
                  "tree": os.environ["PERF14_PUBLIC_CHECKPOINT_TREE"],
              },
              "source": {
                  "commit": os.environ["PERF14_SOURCE"],
                  "tree": os.environ["PERF14_SOURCE_TREE"],
              },
              "patches": {
                  "candidate_product_and_oracle": {
                      "path": os.environ["PERF14_CANDIDATE_PATCH"],
                      "sha256": os.environ["PERF14_CANDIDATE_PATCH_SHA256"],
                  },
                  "author_tests": {
                      "path": os.environ["PERF14_AUTHOR_PATCH"],
                      "sha256": os.environ["PERF14_AUTHOR_PATCH_SHA256"],
                  },
              },
              "tested_trees": {
                  "product_combo": os.environ["PERF14_PRODUCT_COMBO_TREE"],
                  "final_with_author_tests": os.environ["PERF14_FINAL_TESTED_TREE"],
              },
              "artifact": {
                  "name": os.environ["PERF14_ARTIFACT_NAME"],
                  "path": str(artifact),
                  "bytes": int(os.environ["PERF14_ARTIFACT_BYTES"]),
                  "sha256": os.environ["PERF14_ARTIFACT_SHA256"],
                  "architecture": "darwin/arm64",
                  "mach_o": os.environ["PERF14_FILE_ID"],
                  "raw_artifact": True,
              },
              "vcs": {
                  "revision": os.environ["PERF14_SOURCE"],
                  "modified": vcs_modified,
                  "status": status,
                  "build_info": build_info,
              },
              "build_input": build_input,
          }
          if hashlib.sha256(artifact.read_bytes()).hexdigest() != manifest["artifact"]["sha256"]:
              raise SystemExit("artifact hash changed while writing manifest")
          if artifact.stat().st_size != manifest["artifact"]["bytes"]:
              raise SystemExit("artifact byte count changed while writing manifest")
          Path(os.environ["PERF14_ROOT"], "manifest.json").write_text(json.dumps(manifest, indent=2) + "\n")
          PY
          python3 - "$root/manifest.json" <<'PY'
          import json
          import sys
          m = json.load(open(sys.argv[1]))
          assert m["tested_trees"]["final_with_author_tests"] == "c4f516769e4d07bffc359f980ff2fa9b5c2114ca"
          assert m["artifact"]["architecture"] == "darwin/arm64"
          assert m["artifact"]["raw_artifact"] is True
          assert m["vcs"]["modified"] is True
          print("manifest=PASS")
          PY
      - name: Upload raw binary and receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf14-darwin-arm64-build
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/perf14/agentmirrord-darwin-arm64
            ${{ runner.temp }}/perf14/manifest.json
            ${{ runner.temp }}/perf14/build-info.txt
            ${{ runner.temp }}/perf14/file.txt
            ${{ runner.temp }}/perf14/vcs-status.txt
            ${{ runner.temp }}/perf14/build-input.txt
            ${{ runner.temp }}/perf14/identity-receipt.txt
