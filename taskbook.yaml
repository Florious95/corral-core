  - id: fix-cellheight-writeback
    title: "cellHeight 从不回写测量值：rows 上报偏大，底部内容被画到画布外（缺陷② 的纵轴镜像）"
    status: todo
    owner: null
    contention: none
    discovered: "2026-08-14 由 w-scroll-dev 在④ 只读调研中发现，非用户报障"
    context: |
      **和缺陷②（fix-cols-grid-convergence）是同一个 bug 的另一个轴。**
      ② 修的是：measureCells() 实测 cellWidth 后回写给 presenter（setMeasuredCellWidth），
      使上报的 cols 与画布实际能容纳的列数一致。
      **cellHeight 那条回写通路从来没做过：**
        TermViewPresenter.kt:339  rows = viewportHeightPx / cellHeight  ← cellHeight 恒为
                                  DEFAULT_CELL_HEIGHT=20（只有捏合缩放会改它）
        TermSurfaceView.kt:428    cellH = descent - ascent              ← 真实值只存 View 私有字段
        TermSurfaceView.kt:262    rowY = (logical - win.first) * cellH  ← 画字用真实值
      于是「报给服务端有多少行」用偏小的 nominal 高度算（rows 偏大），
      而「画布上每行占多高」用真实高度 ⇒ 最下面几行被画到画布下缘之外。
      预测体感：底部内容/输入区被吃掉一截，或最新几行要手动下滚才看得到。
      **④ 依赖此项**：TermSurfaceView.onScroll 的 lineHeightPx = presenter.cellHeight，
      行高被低估 ⇒ 同样像素位移被算成更多行 ⇒ deltaLines 量级偏大（符号已在第 9 轮修对，量未必准）。
      **未闭合的取证**：真实字形高度与 20px 差多少，至今没有数字。
      Robolectric LEGACY 图形对 fontMetrics 返回全 0，JVM 上量不出来，
      需模拟器/真机实测或切 NATIVE 图形模式。不许用推断的数字代替。

      **2026-08-14 用户答复：从未遇到过底部内容显示不全、或最新几行要手动下滚才可见。**
      这条负面观测把本任务降档，并给出一个更可能的解释：
      nominal 20px 很可能当初就是照着 textSize=20×0.85=17px 等宽字体的
      descent-ascent（典型 20~21px）定的，本来就接近准确 ⇒ 误差接近零 ⇒ 从不表现。
      而② 的宽度轴差 10%（10 vs 11），是因为等宽字体字符步进宽度约为 em 的 0.6 倍，
      那 1px 被 126 列放大成 12 列的偏差，所以肉眼可见。
      **结论：回写通路缺失是真的（结构性缺陷），但实际影响可能为零。**
      **因此本任务的第一步不是修，是量**——量出来若差 ≤1px 就只补注释说明
      「nominal 与实测同量级，回写通路刻意未做」，不动代码；差得多才修。
      禁止在没有那个数字之前动手改代码。
    acceptance:
      - "先量后改：拿到真实测量 cellHeight 与 nominal 20px 的实际差值（模拟器/真机实证，禁止推断）"
      - "红测：给定 viewportHeightPx 与真实字高，断言上报的 rows 与画布实际能完整容纳的行数一致（先红后绿）"
      - "红测：不倒退——缺陷② 的 cellWidth 回写与 cols 收敛行为不受影响"
      - "眼见为实：模拟器上截图证明底部行完整、不再被画布下缘裁切；改前必须先复现裁切"
      - "bash -lc 'cd app && env -u TEAM_AGENT_* ./gradlew :app:testDebugUnitTest'"
      - "bash -lc 'python3 tools/archwiki/build_wiki.py --check --strict-t3'"
    deps: ["fix-cols-grid-convergence"]
    write_scope: ["app/app/src/main/java/dev/agentmirror/app/termview/", "app/app/src/test/"]
    evidence: ".team/evidence/fix-cellheight-writeback.json"

