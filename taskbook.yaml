  - id: investigate-short-swipe-deadzone
    title: "短距离上滑死区未解释：150px 以下 0 帧，而 touch slop 只有 20px"
    status: todo
    owner: null
    contention: none
    discovered: "2026-08-14 w-scroll-qa 在④ 第10轮复测中发现并自证；假设已被自己的测量推翻"
    context: |
      模拟器实测（adb input swipe 合成事件，时长统一 3000ms）：
        700px → 34 帧，正常     300px → 15 帧，正常
        150px → 0 帧            130 / 100 / 50px → 全部 0 帧
      断点在 150~300px 之间。
      **最初假设（Android touch slop 地板）已被测量推翻**：
      `adb shell dumpsys input` 读出 TapSlop = 20.0px；`wm density` = 480（3.0x），
      AOSP 默认 8dp×3 = 24px，两个独立读数互证同一量级。
      20px 解释不了 150~300px 的死区，差 7~15 倍。
      第 10 轮新加的 pendingScrollPx 是 Float，数学上不丢亚像素；
      且实测是 onScroll **压根没被调用**，不是 deltaLines 算成 0 —— 问题在手势识别之前那一关。

      **关键存疑：这个死区可能只存在于合成事件下。**
      `adb input swipe` 生成的 MotionEvent 采样密度与真手指完全不同，
      而真正的被测对象是一根手指。本工程 2026-08-14 已四次栽在
      「测了替身而不是真正的被测对象」（capture-pane 替 pipe-pane、自建 client 替工厂、
      注协议帧替手势层、Int.MIN_VALUE 骗过 `<0` 断言），这是第五个候选替身，
      只是这次替身是测试手段本身。
      **因此下一步不是继续在模拟器上做实验，是先拿到真手指的结果。**
    acceptance:
      - "先取真机数据：用户在真机上做一次很轻很短（1~2cm）的上滑，报告动没动"
      - "真机上不复现 ⇒ 判定为合成事件伪影，关闭本项并在④ 证据里注明模拟器该量级不可信"
      - "真机上复现 ⇒ 才继续查；届时禁止再用 adb input swipe 作判据，须用真实触摸录制回放"
      - "禁止在没有真机结果之前改代码"
    deps: ["feat-remote-scroll-forward"]
    write_scope: ["e2e/", "docs/"]
    evidence: ".team/evidence/investigate-short-swipe-deadzone.json"

