  - id: fix-tsnetbind-align
    goal: >
      修复 `docs/stage3-issue-inventory.md` 分组 G 的 `Aligned16KB`（3 条为同一 AAR 的重复告警）：
      `app/app/libs/tsnetbind.aar` 内的 `jni/arm64-v8a/libgojni.so` **未按 16KB 对齐**。
