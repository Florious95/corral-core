      含 INTERNET 且 cleartext 允许。
    acceptance:
      - "bash -lc 'cd app && ./gradlew -q :app:testDebugUnitTest --tests \"*Manifest*\"'"
    deps: ["pairing-ui"]
    write_scope: ["app/app/src/main/AndroidManifest.xml", "app/app/src/test/", "app/app/build.gradle.kts"]
    evidence: ".team/evidence/fix-app-network-manifest.json"
    contention: impl

