  - id: arch-criteria-t3
    goal: >
      阶段一的验收定义先行：把"注释最新/契约齐"变成机器判据，否则该阶段只能靠席位自报。
      命名裁定（leader 2026-08-11）：tools/archwiki/build_wiki.py 里 T2-1/T2-2 已被 FUTURE_CRITERIA
      占用（零消费者包 / 孤儿子图）、T2-3 被 parse_exoskeleton_fences 预留，故新判据另开 T3 系列，
      不得覆盖既有编号。落地两条：
      T3-1 符号级 doc 覆盖——非测试导出符号（Go 顶层导出 decl / Kotlin 顶层 public 声明）必须有紧邻 doc/KDoc；
      T3-2 引用真实性（限定形状）——注释文本里提到的符号名、仓库文件路径、CLI flag 必须在仓库中真实存在。
      **边界更正（leader 2026-08-11，w-t3-verify 对抗性复核判 refuted 后改写）**：本条原写作
      "专抓注释谎称设置里有重配按钮那类"，那是 leader 的目标设定错误——D-14 的谎言是自然语言语义断言
      （"见 WorkspaceScreen 顶栏设置钮"：该符号真实存在，不存在的是它顶栏上那个按钮），
      静态判据永远解析不出"某组件里有没有某按钮"。实证：取 9c2adf3 的谎报原件跑 --strict-t3 得 exit 0。
      故本条的真实职责限定为**引用形状可判者**：反引号符号、含路径分隔且带已知扩展名的路径、--flag。
      行为性/语义性断言不归判据管，归用例管（D-14 现由 PairingUxTest 的重配入口可达性断言守住）——
      阶段一的验收因此是两条腿，缺一条就会把"看着做完了"当成做完了。
      同一复核暴露的**真实现缺口必须修**：T3-2 当前只扫 Go doc 与 Kotlin /** */ KDoc，
      普通 `//` 与 `/* */` 注释完全不扫，实证在 Go/Kotlin 双侧写形状完全正确的假符号/假路径/假 flag
      都抓不到；Kotlin KDoc 里的 --flag 谎报也不抓。扫描面须扩到全部注释形态，双侧对齐。
      准入纪律（沿用本文件既有约定）：每条判据必须先配红测 fixture 才准入——testdata/ 下各建至少一个
      必红 mini-repo，另各配一个必绿的阳性对照 fixture（防"没扫到"被当成"干净"），全部挂进 test_check.py。
      分级开关：默认报告模式（列清单、不改变退出码，因真仓库 18 包尚未刷注释、此刻必然大面积违规），
      --strict-t3 才计入退出码，--pkg 包名 支持单包硬判——阶段一逐包收口时用它做每包 acceptance。
      对真仓库跑一次报告模式，清单落 docs/wiki/t3-report.md（阳性对照：清单必须非空，空即判工具没真扫）。
      红线：既有 T1-1/T1-2 必须保持绿；不得为了让真仓库好看而放宽判据。
    acceptance:
      - "bash -lc 'env -u TEAM_AGENT_* python3 -m unittest discover -s tools/archwiki -p \"test_*.py\"'"
      - "bash -lc 'python3 tools/archwiki/build_wiki.py --check'"
      - "bash -lc 'test -s docs/wiki/t3-report.md && grep -q \"T3-1\" docs/wiki/t3-report.md && grep -q \"T3-2\" docs/wiki/t3-report.md'"
    deps: []
    write_scope: ["tools/archwiki/", "docs/wiki/t3-report.md"]
    evidence: ".team/evidence/arch-criteria-t3.json"
    contention: impl

  - id: arch-criteria-t3-contract
    goal: >
      阶段二（补契约）的验收定义先行，与 arch-criteria-t3 同一逻辑：判据不先立，
      补契约就只能靠席位自报。落地两条新判据，编号续 T3 系列（T2-x 已被既有 FUTURE_CRITERIA 占用）：
      T3-3 契约标签完备——凡标了 @contract 的符号，四标签 @pre / @post / @err / @inv 必须齐全，
      允许显式写 none（表示"确无此项"），但不许缺项；缺项即"契约半成品"，比没有契约更坏，
      因为它让读者以为契约已定。
      T3-4 跨层声明一致——@consumes 声明的包必须真在该包的 import 图里；反之，跨层 import 了
      却没声明的判架构漂移。这条让架构维基能从代码现算真依赖，而不是只统计 import。
      标签集以 docs/next-round-plan-20260810.md §3.1 为准（@contract / @pre / @post / @inv /
      @err / @consumes / @produces），本工程自定，不套用任何 Rust 工程的既有标注标准。
      Go 写在 doc 注释里，Kotlin 写同名 KDoc 标签。
      准入纪律与分级开关全部沿用 arch-criteria-t3 既有约定：每条判据先配必红 fixture 再配必绿
      阳性对照（四格齐才准入，防"没扫到"被当成"干净"），挂进 test_check.py；
      默认报告模式不改退出码，--strict-t3 计入退出码，--pkg 单包硬判供阶段二逐包收口。
      复用 arch-criteria-t3 已建成的 _all_comment_lines 字符串感知提取器，不另起炉灶。
      边界诚实（承 arch-criteria-t3 的教训，不得重犯）：本条只验标签的完备性与声明一致性，
      **不验契约内容是否描述正确**——"@post 写的是不是真的"属语义事实，静态判据判不了，
      那一面由用例覆盖。报告与 HANDBOOK 必须明写这条边界，不许暗示有它不具备的保护力。
      对真仓库跑一次报告模式，清单落 docs/wiki/t3-report.md 的新增两节
      （阳性对照：当前全仓库尚未标注 @contract，故 T3-3 违规数很可能为 0——**这个 0 必须自证是
      "真没有标注"而不是"判据扫不到"**，做法是造一个带残缺 @contract 的 fixture 与真仓库同法扫描，
      并在报告里给出"扫描到的 @contract 符号总数"这一覆盖量数字）。
    acceptance:
      - "bash -lc 'env -u TEAM_AGENT_* python3 -m unittest discover -s tools/archwiki -p \"test_*.py\"'"
      - "bash -lc 'python3 tools/archwiki/build_wiki.py --check'"
      - "bash -lc 'grep -q \"T3-3\" docs/wiki/t3-report.md && grep -q \"T3-4\" docs/wiki/t3-report.md'"
    deps: ["arch-criteria-t3"]
    write_scope: ["tools/archwiki/", "docs/wiki/t3-report.md"]
    evidence: ".team/evidence/arch-criteria-t3-contract.json"
    contention: impl

