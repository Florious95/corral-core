  - id: fix-mainactivity-store-injectable
    title: "可测试性缺陷：MainActivity 硬编码 Keystore store，冷启动读配置这一环 JVM 上验不了"
    status: todo
    owner: null
    contention: none
    discovered: "2026-08-14 w-tsnet-dev 写⑤ 的 T4 冷启动红测时撞上，如实上报而非绕过"
    context: |
      用户症状链：配对存 key → **MainActivity 从 store 读回** → PersistentConnection 见非空 key
      → ensureStarted → tsnet 起网 → 能连上。
      两端都已有断言：
        - 落盘侧 `saveThenLoad_roundTripsTsAuthKey`：store 能持久化并读回 tsAuthKey
        - 装配侧 `ColdStartReconnectTest.coldStart_persistedTsAuthKey_triggersTsnetStart`：
          给定含 key 的配置，冷启动装配确实拉起 tsnet
      **中间那一环没有断言**：`MainActivity:87` 硬编码真实 `SharedPreferencesPairingConfigStore`
      （Android Keystore cipher），而 Robolectric 不提供 AndroidKeyStore provider，无法注入假 cipher。
      当前风险评估为低——该环与 ws url / token 的读取共用同一条代码路径，而那条路径
      在真机上反复被证明有效（App 冷启动能带着已存配置连上 LAN 地址）。
      **但它确实是用户症状链上唯一没有断言的一环**，不许因为"应该没问题"而永久搁置。
    acceptance:
      - "让 MainActivity 的 configStore 可注入（构造参数 / 工厂 / 内部可见的 seam 均可，选最小改动）"
      - "红测：注入假 store（含 tsAuthKey）走冷启动完整链路，断言 ensureStarted 被调用——补上中间那一环"
      - "红测：不倒退——真实 Keystore 路径在真机/instrumented 上仍正常（不许为了可测试性把加密存储换掉）"
      - "bash -lc 'cd app && env -u TEAM_AGENT_* ./gradlew :app:testDebugUnitTest'"
    deps: ["fix-tsnet-resume-reconnect"]
    write_scope: ["app/app/src/main/java/dev/agentmirror/app/MainActivity.kt", "app/app/src/test/"]
    evidence: ".team/evidence/fix-mainactivity-store-injectable.json"

  - id: feat-font-size-setting-drop-pinch
    title: "移除捏合缩放，改为设置页字号选择；字号→单元尺寸走实测度量，进入前定尺寸"
    status: todo
    owner: null
    contention: contract
    origin: "2026-08-14 用户裁定（架构决策，非缺陷单）"
    context: |
      **用户原话**：「移除捏合相关代码，并行在设置加字体大小设置，字体大小和尺寸相关联，
      此后不再捏合调整……直接改字体大小，背后直接和尺寸关联，进入直接以对应尺寸加载，
      根本上避免上面问题」。

      **捏合关联的三个从未修好的问题**（用户列举）：
        1. 捏合后闪烁，且延迟明显
        2. 边缘在屏幕外（＝缺陷②）
        3. 捏合后大小未延续（不持久化）

      **用户的关键现场证据**：「我进入对话，这个问题是没有的」——
      ② 在进入会话时【不出现】，只在捏合之后出现。
      ⇒ 初始计算是对的，**坏的是重算路径**。leader 最初判断"删捏合不会自动修好②"，
      被这条证据推翻，已收回。

      **代码层的对应（已核实）**：
        TermViewPresenter.onFontSizeChanged(L275)  捏合路径：cellWidth = 名义值 → recomputeGeometry() → 按名义值上报 cols
        TermViewPresenter.setMeasuredCellWidth(L313) 实测回写：下一帧测得实测值 → 不同则再上报一次
        注释原文：「真机收敛序列 seed 名义 10 → 回写实测 11 → 停」
      ⇒ **每次几何变化都先向服务端上报一个错的列数再纠正。**
      进入会话时这次收敛发生在画面出现之前，所以用户看不到；捏合时发生在眼前，所以看得到。

      **另一个被本任务顺带拆掉的结构**（今日发现）：
        TermViewPresenter.kt:294 注释：「否则 cellH→textSize→cellH 反馈环」
        textSize = cellHeight × 0.85，而 cellHeight = descent - ascent
        ⇒ 回写 cellHeight 会成环，所以它被钉死在 DEFAULT_CELL_HEIGHT=20，从不实测。
      本方案把字号变成【用户选定的独立输入】，textSize 不再由 cellHeight 推导 ⇒ 环断开 ⇒
      cellWidth 与 cellHeight 都能用实测值。这使 `fix-cellheight-writeback` 一并消解。
    hard_requirements:
      - "字号 → 单元尺寸【必须走实测字形度量】（measureText / fontMetrics），禁止查表配常量——否则② 会在固定字号下原样活下来"
      - "禁止保留「先用名义值播种、再靠实测回写收敛」的模式：几何只算一次，且算的时候就用实测值，不许先上报一个错的 cols 再纠正"
      - "字号必须持久化（用户列举的问题 3：捏合后大小未延续）"
      - "进入会话前尺寸即已确定，首帧就是最终尺寸（用户列举的问题 1：闪烁与延迟的根治方式）"
    acceptance:
      - "红测：给定字号，断言上报的 cols 与画布实际能完整容纳的列数一致（先红后绿）"
      - "红测：全流程只上报一次 resize，不存在「名义值 → 实测值」两次上报（钉死播种-收敛模式已消失）"
      - "红测：字号变更后重启 App，断言仍是所选字号（持久化）"
      - "红测：纯 CJK 双宽内容下末列字形右缘不超出画布宽度（吸收 fix-cols-cjk-doublewidth）"
      - "红测：cellHeight 使用实测值而非 DEFAULT_CELL_HEIGHT（吸收 fix-cellheight-writeback）"
      - "眼见为实（2026-08-14 用户指令：暂停模拟器，改走 web 端 + 真机）：
          ① web 端验协议层与几何计算（cols/rows 正确、resize 次数、字号持久化）——这层 web 能覆盖；
          ② 安卓特有的渲染时序与生命周期（无闪烁、首帧即最终尺寸、CJK 末列、IME/后台回前台）
             **web 覆盖不了**，由用户真机验收并导出诊断日志作为证据；
          ③ 禁止用模拟器截图充当上述任一项的证据。
          附记：模拟器 2026-08-14 曾给出错误的绿（在裸 shell 上验滚动全绿，而用户实际用的是
          alt-screen 的 Claude Code），真机才是权威被测对象。"
      - "不倒退：删除捏合后，既有 TermSurfacePinchGestureTest 等测试需一并清理，但终端渲染/输入/重连基本功能全绿"
      - "bash -lc 'cd app && env -u TEAM_AGENT_* ./gradlew :app:testDebugUnitTest'"
      - "bash -lc 'python3 tools/archwiki/build_wiki.py --check --strict-t3'"
    supersedes: ["fix-cellheight-writeback", "fix-cols-cjk-doublewidth"]
    deps: []
    write_scope: ["app/app/src/main/java/dev/agentmirror/app/termview/", "app/app/src/main/java/dev/agentmirror/app/session/", "app/app/src/main/java/dev/agentmirror/app/SettingsScreen.kt", "app/app/src/test/"]
    evidence: ".team/evidence/feat-font-size-setting-drop-pinch.json"
